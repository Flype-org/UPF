<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейная касса УПФ (УралПромФонд)</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
/* ============================================================
   Семейная касса УПФ — стили
   ============================================================ */
:root{
  --navy:#2c3e50; --navy-2:#34495e; --accent:#3498db; --accent-2:#2980b9;
  --green:#27ae60; --green-2:#229954; --red:#e74c3c; --red-2:#c0392b;
  --bg:#f4f7fb; --card:#ffffff; --muted:#7f8c8d; --line:#e1e8f0;
  --shadow:0 6px 22px rgba(44,62,80,.10);
  --shadow-lg:0 18px 48px rgba(44,62,80,.18);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-font-smoothing:antialiased;min-height:100%}
body{display:flex;flex-direction:column;min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-2)}

/* Шапка */
header.topbar{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
header.topbar h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.topbar .user-chip{font-size:13px;opacity:.85;display:flex;align-items:center;gap:8px}
header.topbar .user-chip img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#fff2}

.burger{width:42px;height:42px;border:none;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;flex-shrink:0}
.burger:hover{background:rgba(255,255,255,.22)}
.burger:active{transform:scale(.93)}
.burger span{display:block;width:20px;height:2px;background:#fff;position:relative;border-radius:2px}
.burger span::before,.burger span::after{content:'';position:absolute;left:0;width:20px;height:2px;background:#fff;border-radius:2px}
.burger span::before{top:-6px}
.burger span::after{top:6px}

/* Меню */
.drawer-overlay{position:fixed;inset:0;background:rgba(44,62,80,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:82vw;background:var(--card);z-index:100;transform:translateX(-105%);transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border-radius:0 18px 18px 0}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px 22px 10px;border-bottom:1px solid var(--line)}
.drawer-head .brand{font-weight:700;font-size:15px;color:var(--navy);line-height:1.3}
.drawer-head .brand small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.drawer nav{padding:12px 10px;flex:1;overflow-y:auto}
.drawer nav a{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;color:var(--navy);font-weight:500;font-size:15px;margin-bottom:4px;transition:background .18s,color .18s,transform .12s;cursor:pointer}
.drawer nav a:hover{background:#eef4fb;transform:translateX(3px)}
.drawer nav a.active{background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(52,152,219,.35)}
.drawer nav a.active:hover{background:var(--accent-2)}
.drawer nav a .ico{width:20px;text-align:center;font-size:17px}
.drawer-foot{padding:12px 10px 20px;border-top:1px solid var(--line)}
.drawer-foot a{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;font-weight:500;cursor:pointer;color:var(--red);transition:background .18s}
.drawer-foot a:hover{background:#fdeaea}
.drawer-foot a .ico{width:20px;text-align:center;font-size:17px}

/* Контент */
main.page{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:22px 16px 32px;animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
h2.page-title{font-size:22px;margin:4px 0 18px;color:var(--navy)}
.section-title{font-size:17px;margin:26px 0 12px;color:var(--navy)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card+.card{margin-top:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;transition:transform .12s,box-shadow .2s,background .2s,opacity .2s;box-shadow:0 4px 12px rgba(52,152,219,.3);font-family:inherit}
.btn:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 8px 18px rgba(52,152,219,.35)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 4px 12px rgba(39,174,96,.3)}
.btn.green:hover{background:var(--green-2)}
.btn.red{background:var(--red);box-shadow:0 4px 12px rgba(231,76,60,.3)}
.btn.red:hover{background:var(--red-2)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:none;border:1.5px solid var(--line)}
.btn.ghost:hover{background:#eef4fb}
.btn.small{padding:8px 13px;font-size:13px}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--navy-2)}
.field input,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;color:var(--navy);background:#fff;transition:border-color .2s,box-shadow .2s;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(52,152,219,.14)}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.field.error input{border-color:var(--red)}
.field .err-msg{color:var(--red);font-size:12.5px;margin-top:5px;display:none}
.field.error .err-msg{display:block}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row-2{grid-template-columns:1fr}}

/* Тосты */
.toast-wrap{position:fixed;top:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--navy);color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;max-width:320px;animation:toastIn .3s ease both;border-left:4px solid var(--accent)}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

/* Модальные окна */
.modal-overlay{
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  width:100vw;
  height:100vh;
  background:rgba(44,62,80,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s;
  /* Предотвращаем прокрутку фона */
  overflow:hidden; 
}
.modal {
  background:var(--card);
  border-radius:16px;
  width:100%;
  max-width:480px;
  max-height:90vh; /* Ограничиваем высоту экраном */
  overflow-y:auto; /* Внутри модалки будет свой скролл */
  box-shadow:var(--shadow-lg);
  transform:translateY(24px) scale(.97);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  padding:22px;
  margin: auto; /* Центрирование по вертикали */
}

/* Казна */
.treasury-wrap{display:flex;flex-direction:column;align-items:center;gap:26px;margin-bottom:10px}
.treasury{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#4aa3e0,var(--accent) 55%,var(--accent-2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 16px 40px rgba(52,152,219,.4),inset 0 0 40px rgba(255,255,255,.12);position:relative;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.treasury .label{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;opacity:.9}
.treasury .amount{font-size:34px;font-weight:700;margin:6px 0 2px}
.treasury .sub{font-size:12.5px;opacity:.85}

.members-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;width:100%;max-width:820px}
.member-circle{background:var(--card);border-radius:20px;padding:18px 12px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s,box-shadow .2s;border:2px solid transparent;animation:fadeUp .4s ease both}
.member-circle:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#dce8f5}
.member-circle:active{transform:scale(.97)}
.member-circle .ava{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,#e8f1fa,#d3e5f6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--accent-2);overflow:hidden;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.member-circle .ava img{width:100%;height:100%;object-fit:cover}
.member-circle .mname{font-size:14px;font-weight:600;margin-bottom:3px}
.member-circle .mcontrib{font-size:13px;color:var(--green);font-weight:600}
.member-circle .mdebt{font-size:12px;color:var(--red);margin-top:2px;font-weight:600}
.member-circle .mdebt.none{color:var(--muted);font-weight:500}

/* Таблицы */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.tbl th,table.tbl td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl th{background:#f0f5fb;font-weight:600;color:var(--navy-2);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#f7fbff}
.amt-in{color:var(--green);font-weight:600}
.amt-out{color:var(--red);font-weight:600}
.empty-note{color:var(--muted);font-size:14px;padding:18px;text-align:center}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge.green{background:#e5f6ec;color:var(--green-2)}
.badge.red{background:#fdeaea;color:var(--red-2)}
.badge.blue{background:#e7f2fb;color:var(--accent-2)}
.badge.gray{background:#eef1f4;color:var(--muted)}

/* Экран входа */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(150deg,#eaf2fb 0%,#f4f7fb 45%,#e7f0f9 100%)}
.auth-box{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:440px;padding:30px 26px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
.auth-brand{text-align:center;margin-bottom:22px}
.auth-brand .logo{width:62px;height:62px;border-radius:50%;margin:0 auto 12px;background:radial-gradient(circle at 32% 28%,#4aa3e0,var(--accent) 60%,var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 10px 24px rgba(52,152,219,.4)}
.auth-brand h1{font-size:19px;margin:0 0 4px;color:var(--navy)}
.auth-brand p{font-size:13px;color:var(--muted);margin:0}
.auth-tabs{display:flex;background:#eef4fb;border-radius:12px;padding:4px;margin-bottom:20px}
.auth-tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .2s,color .2s;font-family:inherit}
.auth-tabs button.active{background:#fff;color:var(--accent-2);box-shadow:0 2px 8px rgba(0,0,0,.08)}

.pin-user{text-align:center;margin-bottom:18px}
.pin-user .ava{width:78px;height:78px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,#e8f1fa,#cfe3f6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:var(--accent-2);overflow:hidden;border:3px solid #fff;box-shadow:0 8px 22px rgba(52,152,219,.25);animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
.pin-user .ava img{width:100%;height:100%;object-fit:cover}
.pin-user .uname{font-size:17px;font-weight:700;color:var(--navy)}
.pin-user .uhint{font-size:12.5px;color:var(--muted);margin-top:2px}

.pin-dots{display:flex;justify-content:center;gap:16px;margin:18px 0 22px}
.pin-dots .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);background:transparent;transition:background .18s,transform .18s}
.pin-dots .dot.filled{background:var(--accent);transform:scale(1.12)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.pin-pad button{height:62px;border:none;border-radius:16px;background:#f0f5fb;color:var(--navy);font-size:24px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 2px 6px rgba(44,62,80,.07)}
.pin-pad button:hover{background:#e3eefa}
.pin-pad button:active{transform:scale(.93);background:#d5e6f7}
.pin-pad button.fn{font-size:16px;font-weight:600;color:var(--accent-2);background:#e7f2fb}
.pin-pad button.fn:hover{background:#d9ebfa}
.pin-pad button.fn.del{color:var(--red);background:#fdeaea}
.pin-pad button.fn.del:hover{background:#fbdcdc}

.pin-locked{text-align:center;padding:22px 12px;background:#fdeaea;border-radius:14px;color:var(--red-2);font-weight:600;font-size:14px;margin-bottom:14px}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;padding:6px;transition:color .15s}
.link-btn:hover{color:var(--accent-2);text-decoration:underline}
.center{text-align:center}
.mt-10{margin-top:10px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mb-10{margin-bottom:10px}
.text-muted{color:var(--muted);font-size:13px}

/* Аккаунт */
.avatar-edit{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.avatar-preview{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#e8f1fa,#cfe3f6);display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow);font-size:30px;font-weight:700;color:var(--accent-2);flex-shrink:0}
.avatar-preview img{width:100%;height:100%;object-fit:cover}

/* Карта */
.bank-card{width:100%;max-width:440px;aspect-ratio:1.586/1;border-radius:18px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 55%,#3d566e 100%);color:#fff;padding:20px;display:flex;gap:16px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
.bank-card::before{content:'';position:absolute;top:-60%;right:-20%;width:70%;height:160%;background:radial-gradient(circle,rgba(52,152,219,.35),transparent 65%);pointer-events:none}
.bank-card .qr-side{width:38%;background:#fff;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center;align-self:center}
.bank-card .qr-side img,.bank-card .qr-side canvas{width:100%;height:auto;border-radius:4px;image-rendering:pixelated}
.bank-card .data-side{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0;z-index:1}
.bank-card .card-title{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;opacity:.8}
.bank-card .card-org{font-size:13px;font-weight:700;margin:2px 0 10px}
.bank-card .card-fio{font-size:14px;font-weight:600;line-height:1.25;margin-bottom:10px;word-break:break-word}
.bank-card .card-num{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;font-weight:700;margin-bottom:4px}
.bank-card .card-cvv{font-size:12px;opacity:.9}
.bank-card .card-cvv b{letter-spacing:2px}
.bank-card.blocked{filter:grayscale(.7) brightness(.9)}
.bank-card.blocked::after{content:'ЗАБЛОКИРОВАНА';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(44,62,80,.35);font-size:20px;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
@media(max-width:480px){
  .bank-card{padding:14px;gap:10px}
  .bank-card .card-num{font-size:13px;letter-spacing:1px}
  .bank-card .card-fio{font-size:12px}
}

/* Подвал */
footer.disclaimer{text-align:center;padding:18px 16px 26px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:#fbfdff;margin-top:auto}

/* Экран загрузки */
#loadingScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#d9e8f5;animation:fadeIn .4s ease both}
#loadingScreen.hide{animation:fadeOut .5s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}
.loading-landscape{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9}
.loading-greeting{position:absolute;top:24px;left:28px;font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35);animation:slideIn .6s ease both;z-index:2}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.loading-ring-wrap{position:relative;width:140px;height:140px;z-index:2}
.loading-ring{width:100%;height:100%;transform:rotate(-90deg)}
.loading-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.35);stroke-width:8}
.loading-ring .ring-fg{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 2px 6px rgba(0,0,0,.2))}
.loading-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.landscape-winter{background:linear-gradient(180deg,#e8f0fa 0%,#c5d8ec 60%,#a8c0da 100%)}
.landscape-spring{background:linear-gradient(180deg,#e8f5e0 0%,#c5e8c0 60%,#a8d8b0 100%)}
.landscape-summer{background:linear-gradient(180deg,#a8d8f0 0%,#f0e8a0 60%,#c8d870 100%)}
.landscape-autumn{background:linear-gradient(180deg,#f0d8a8 0%,#e0b880 60%,#c89060 100%)}

/* Адаптив */
@media(max-width:640px){
  header.topbar h1{font-size:14px}
  main.page{padding:16px 12px 26px}
  .treasury{width:190px;height:190px}
  .treasury .amount{font-size:27px}
  .members-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .auth-box{padding:24px 18px}
  h2.page-title{font-size:19px}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c8d6e5;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#a9bfd4}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<!-- Экран загрузки -->
<div id="loadingScreen" style="display:none">
  <div class="loading-landscape" id="loadingLandscape"></div>
  <div class="loading-greeting" id="loadingGreeting">Добрый день!</div>
  <div class="loading-ring-wrap">
    <svg class="loading-ring" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" class="ring-bg"/>
      <circle cx="50" cy="50" r="42" class="ring-fg" id="ringFg"/>
    </svg>
    <div class="loading-pct" id="loadingPct">0%</div>
  </div>
</div>
<audio id="upfSound" src="UPF.mp3" preload="auto"></audio>
<script>
'use strict';

/* ============================================================
   КОНСТАНТЫ
   ============================================================ */
const LS = {
  users:'upf_users', operations:'upf_operations', loans:'upf_loans',
  cards:'upf_cards', requests:'upf_requests', config:'upf_config',

/* ============================================================
   SHA-256 (чистый JS)
   ============================================================ */
const SHA256 = (function(){
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);
  function rotr(x,n){return (x>>>n)|(x<<(32-n))}
  function utf8Bytes(str){
    const out=[];
    for(let i=0;i<str.length;i++){
      let c=str.charCodeAt(i);
      if(c<0x80)out.push(c);
      else if(c<0x800){out.push(0xC0|(c>>6),0x80|(c&0x3F))}
      else if(c<0xD800||c>=0xE000){out.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F))}
      else{i++;c=0x10000+(((c&0x3FF)<<10)|(str.charCodeAt(i)&0x3FF));out.push(0xF0|(c>>18),0x80|((c>>12)&0x3F),0x80|((c>>6)&0x3F),0x80|(c&0x3F))}
    }
    return out;
  }
  return function(msg){
    const bytes=utf8Bytes(msg);
    const bitLen=bytes.length*8;
    bytes.push(0x80);
    while(bytes.length%64!==56)bytes.push(0);
    const lenHi=Math.floor(bitLen/0x100000000);
    const lenLo=bitLen>>>0;
    bytes.push((lenHi>>>24)&0xFF,(lenHi>>>16)&0xFF,(lenHi>>>8)&0xFF,lenHi&0xFF);
    bytes.push((lenLo>>>24)&0xFF,(lenLo>>>16)&0xFF,(lenLo>>>8)&0xFF,lenLo&0xFF);
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    const w=new Uint32Array(64);
    for(let off=0;off<bytes.length;off+=64){
      for(let i=0;i<16;i++)w[i]=(bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
      for(let i=16;i<64;i++){
        const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
        const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
      }
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for(let i=0;i<64;i++){
        const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
        const ch=(e&f)^(~e&g);
        const t1=(h+S1+ch+K[i]+w[i])>>>0;
        const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
        const maj=(a&b)^(a&c)^(b&c);
        const t2=(S0+maj)>>>0;
        h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
      }
      h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;
      h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;
    }
    const out=[h0,h1,h2,h3,h4,h5,h6,h7];
    return out.map(x=>x.toString(16).padStart(8,'0')).join('');
  };
})();

function makeHash(secret){const salt=uid()+uid();return{salt,hash:SHA256(salt+'::'+secret)}}
function verifyHash(secret,salt,hash){return SHA256(salt+'::'+secret)===hash}

async function claimAdminSession(sessionId){

      if(cur&&cur.active&&cur.sessionId&&cur.sessionId!==sessionId&&cur.heartbeatAt){

function getTreasuryBalance(){
  let bal=0;
  for(const op of getOps()){
    if(op.type==='contribute')bal+=op.amount;
    else if(op.type==='loan_out')bal-=op.amount;
    else if(op.type==='loan_return')bal+=op.amount;
    else if(op.type==='personal_to_treasury')bal+=op.amount;
    else if(op.type==='admin_treasury_out')bal-=op.amount;
  }
  return Math.max(0,bal);
}
function getUserContributed(userId){
  let s=0;
  for(const op of getOps().filter(o=>o.userId===userId)){
    if(op.type==='contribute'||op.type==='personal_to_treasury')s+=op.amount;
  }
  return s;
}
function getPersonalBalance(userId){
  let b=0;
  for(const op of getOps().filter(o=>o.userId===userId)){
    if(op.type==='personal_deposit')b+=op.amount;
    else if(op.type==='personal_withdraw')b-=op.amount;
    else if(op.type==='personal_to_treasury')b-=op.amount;
  }
  return Math.max(0,b);
}

/* ============================================================
   QR-КОД (мини-реализация без CDN)
   ============================================================ */
function makeQR(text){
  const data=[];
  for(let i=0;i<text.length;i++){
    let c=text.charCodeAt(i);
    if(c<0x80)data.push(c);
    else if(c<0x800){data.push(0xC0|(c>>6),0x80|(c&0x3F))}
    else{data.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F))}
  }
  if(data.length>44)return null;
  const size=29;
  const mods=Array.from({length:size},()=>Array(size).fill(false));
  const reserved=Array.from({length:size},()=>Array(size).fill(false));
  function placeFinder(r,c){
    for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){
      const rr=r+i,cc=c+j;
      if(rr<0||rr>=size||cc<0||cc>=size)continue;
      reserved[rr][cc]=true;
      if((i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4))mods[rr][cc]=true;
    }
  }
  placeFinder(0,0);placeFinder(0,size-7);placeFinder(size-7,0);
  for(let i=8;i<size-8;i++){mods[6][i]=i%2===0;reserved[6][i]=true;mods[i][6]=i%2===0;reserved[i][6]=true}
  mods[size-8][8]=true;reserved[size-8][8]=true;
  const fmt='101010000010010';
  const p1=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  const p2=[[size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],[8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]];
  const fb=fmt.split('').map(Number);
  for(let i=0;i<15;i++){mods[p1[i][0]][p1[i][1]]=fb[i]===1;mods[p2[i][0]][p2[i][1]]=fb[i]===1}
  reserved[8][size-8]=true;mods[8][size-8]=true;
  const bits=[];
  const pushBits=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1)};
  pushBits(4,4);pushBits(data.length,8);
  for(const b of data)pushBits(b,8);
  const cap=44*8;
  while(bits.length<cap)bits.push(0);
  while(bits.length%8!==0)bits.push(0);
  const pad=[0xEC,0x11];let pi=0;
  while(bits.length<cap){pushBits(pad[pi%2],8);pi++}
  let bi=0,col=size-1,up=true;
  while(col>0){
    if(col===6)col--;
    for(let k=0;k<size;k++){
      const row=up?(size-1-k):k;
      for(let dc=0;dc<2;dc++){
        const c=col-dc;
        if(reserved[row][c])continue;
        if(bi<bits.length){mods[row][c]=bits[bi]===1;bi++}
      }
    }
    up=!up;col-=2;
  }
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    if(reserved[r][c])continue;
    if((r+c)%2===0)mods[r][c]=!mods[r][c];
  }
  return mods;
}
function drawQR(container,text){
  if(!container)return;
  container.innerHTML='';
  const mods=makeQR(text);
  if(!mods){container.innerHTML='<div style="font-size:11px;color:#7f8c8d;padding:6px;text-align:center">QR</div>';return}
  const size=mods.length,scale=4,pad=2,px=size*scale+pad*2;
  const cv=document.createElement('canvas');
  cv.width=px;cv.height=px;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,px,px);
  ctx.fillStyle='#2c3e50';
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    if(mods[r][c])ctx.fillRect(pad+c*scale,pad+r*scale,scale,scale);
  }
  cv.style.width='100%';cv.style.height='auto';cv.style.imageRendering='pixelated';
  container.appendChild(cv);

const genCardNumber=()=>String(1+Math.floor(Math.random()*9))+randomDigits(9);

function cropAvatar(file,size,cb){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');
      cv.width=size;cv.height=size;
      const ctx=cv.getContext('2d');
      const side=Math.min(img.width,img.height);
      const sx=(img.width-side)/2,sy=(img.height-side)/2;
      ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.closePath();ctx.clip();
      ctx.drawImage(img,sx,sy,side,side,0,0,size,size);
      cb(cv.toDataURL('image/jpeg',0.85));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function getGreeting(name){
  const h=new Date().getHours();
  let greet;
  if(h>=5&&h<12)greet='Доброе утро';
  else if(h>=12&&h<18)greet='Добрый день';
  else if(h>=18&&h<23)greet='Добрый вечер';
  else greet='Доброй ночи';
  return greet+', '+name+'!';
}
function getSeasonClass(){
  const m=new Date().getMonth();
  if(m>=2&&m<=4)return 'landscape-spring';
  if(m>=5&&m<=7)return 'landscape-summer';
  if(m>=8&&m<=10)return 'landscape-autumn';
  return 'landscape-winter';
}

  return new Promise(resolve=>{

    const iv=setInterval(()=>{
      progress=Math.min(100,progress+4+Math.random()*4);
      ring.style.strokeDashoffset=String(C*(1-progress/100));

  noMoney:'Недостаточно средств.',

/* ---------- Создание заявки пользователем ---------- */
async function createRequest(type,payload){
  const sess=getSession();
  if(!sess)throw new Error('Нет сессии');
  const me=sess.user;
  if(me.blocked)throw new Error('Аккаунт заблокирован');

  if([REQ_TYPE.PERSONAL_WITHDRAW,REQ_TYPE.PERSONAL_TO_TREASURY,REQ_TYPE.CONTRIBUTE,REQ_TYPE.RETURN_LOAN].includes(type)){
    const bal=getPersonalBalance(me.id);
    const amt=Number(payload.amount)||0;
    if(amt>bal)throw new Error('Недостаточно средств на личном счёте. Доступно: '+fmtMoney(bal));
  }
  if(type===REQ_TYPE.TAKE_LOAN){
    const tre=getTreasuryBalance();
    const amt=Number(payload.amount)||0;
    if(amt>tre)throw new Error('Нельзя занять больше, чем в казне ('+fmtMoney(tre)+').');
    if(getActiveLoan(me.id))throw new Error('У вас уже есть активный заём.');
  }
  if(type===REQ_TYPE.RETURN_LOAN&&!getActiveLoan(me.id))throw new Error('Нет активного займа.');
  if(type===REQ_TYPE.ISSUE_CARD&&getUserCard(me.id))throw new Error('Карта уже оформлена.');

  const req={
    id:uid(),type,userId:me.id,userName:me.fio,payload,
    status:'pending',adminComment:'',createdAt:nowISO(),
    reviewedAt:null,reviewedBy:null
  };
  const reqs=getRequests();
  reqs.push(req);
  saveRequests(reqs);
  if(_fbReady)await fbSet('requests/'+req.id,req);
  return req;
}

/* ---------- Одобрение / отклонение (только админ) ---------- */
async function approveRequest(requestId,commentKey){
  const sess=getSession();
  if(!sess||sess.user.role!=='admin')throw new Error('Только админ');
  const reqs=getRequests();
  const req=reqs.find(r=>r.id===requestId);
  if(!req||req.status!=='pending')return;
  const comment=ADMIN_COMMENTS[commentKey]||ADMIN_COMMENTS.ok;
  try{
    await executeApprovedOperation(req);
    req.status='approved';
    req.adminComment=comment;
    req.reviewedAt=nowISO();
    req.reviewedBy=sess.user.id;
    saveRequests(reqs);
    if(_fbReady)await fbUpdate('requests/'+req.id,{status:'approved',adminComment:comment,reviewedAt:req.reviewedAt,reviewedBy:req.reviewedBy});
    toast('Одобрено: '+comment,'ok');
  }catch(e){
    toast('Ошибка: '+e.message,'err');
    throw e;
  }
}

async function rejectRequest(requestId,commentKey){
  const sess=getSession();
  if(!sess||sess.user.role!=='admin')throw new Error('Только админ');
  const reqs=getRequests();
  const req=reqs.find(r=>r.id===requestId);
  if(!req||req.status!=='pending')return;
  const comment=ADMIN_COMMENTS[commentKey]||ADMIN_COMMENTS.noMoney;
  req.status='rejected';
  req.adminComment=comment;
  req.reviewedAt=nowISO();
  req.reviewedBy=sess.user.id;
  saveRequests(reqs);
  if(_fbReady)await fbUpdate('requests/'+req.id,{status:'rejected',adminComment:comment,reviewedAt:req.reviewedAt,reviewedBy:req.reviewedBy});
  toast('Отклонено: '+comment,'ok');
}

/* ---------- Исполнение одобренной операции ---------- */
async function executeApprovedOperation(req){
  const {type,userId,userName}=req;
  const payload = req.payload || {};
  const amt=Number(payload.amount)||0;
  const ts=nowISO();
  const requestId=req.id;

  const pushOp=async(op)=>{
    const id=uid();
    const full={id,userId,userName,requestId,ts,...op};
    const ops=getOps();ops.push(full);saveOps(ops);
    // Отправляем в фон, не ждем ответа, чтобы окно закрывалось мгновенно
    if(_fbReady)fbSet('operations/'+id,full).catch(console.error);
    return full;
  };

  switch(type){
    case REQ_TYPE.PERSONAL_DEPOSIT:
      await pushOp({type:'personal_deposit',amount:amt});
      break;

    case REQ_TYPE.PERSONAL_WITHDRAW:
      if(getPersonalBalance(userId)<amt)throw new Error(ADMIN_COMMENTS.noMoney);
      await pushOp({type:'personal_withdraw',amount:amt});
      break;

    case REQ_TYPE.PERSONAL_TO_TREASURY:
    case REQ_TYPE.CONTRIBUTE:
      if(getPersonalBalance(userId)<amt)throw new Error(ADMIN_COMMENTS.noMoney);
      await pushOp({type:'personal_to_treasury',amount:amt});
      break;

    case REQ_TYPE.TAKE_LOAN:{
      if(getTreasuryBalance()<amt)throw new Error(ADMIN_COMMENTS.noMoney);
      if(getActiveLoan(userId))throw new Error('Уже есть активный заём');
      const due=new Date();due.setDate(due.getDate()+LOAN_TERM_DAYS);
      const loanId=uid();
      const loan={id:loanId,userId,userName,amount:amt,percent:LOAN_PERCENT,takenAt:ts,dueDate:due.toISOString(),status:'active',requestId};
      const loans=getLoans();loans.push(loan);saveLoans(loans);
      if(_fbReady)await fbSet('loans/'+loanId,loan);
      await pushOp({type:'loan_out',amount:amt,comment:'Списание из казны на заём'});
      await pushOp({type:'personal_deposit',amount:amt,comment:'Зачисление займа на личный'});
      break;
    }

    case REQ_TYPE.RETURN_LOAN:{
      if(getPersonalBalance(userId)<amt)throw new Error(ADMIN_COMMENTS.noMoney);
      const loan=getActiveLoan(userId);
      if(!loan)throw new Error('Нет активного займа');
      const loans=getLoans();const l=loans.find(x=>x.id===loan.id);
      if(l){l.status='returned';l.returnedAt=ts;l.requestId=requestId}
      saveLoans(loans);
      if(_fbReady)await fbUpdate('loans/'+loan.id,{status:'returned',returnedAt:ts,requestId});
      await pushOp({type:'personal_withdraw',amount:amt,comment:'Списание с личного на возврат'});
      await pushOp({type:'loan_return',amount:amt,comment:'Возврат займа в казну'});
      break;
    }

    case REQ_TYPE.ISSUE_CARD:{
      if(getUserCard(userId))throw new Error('Карта уже оформлена');
      const cardId=uid();
      const card={id:cardId,userId,userName,number:genCardNumber(),code:genCardCode(),status:'active',issuedAt:ts,requestId};
      const cards=getCards();cards.push(card);saveCards(cards);
      if(_fbReady)await fbSet('cards/'+cardId,card);
      break;
    }

    case REQ_TYPE.BLOCK_CARD:{
      const card=getUserCard(userId);
      if(!card)throw new Error(ADMIN_COMMENTS.noCard);
      const newStatus=card.status==='blocked'?'active':'blocked';
      const cards=getCards();const c=cards.find(x=>x.id===card.id);
      if(c)c.status=newStatus;
      saveCards(cards);
      if(_fbReady)await fbUpdate('cards/'+card.id,{status:newStatus,requestId});
      break;
    }

    default:
      throw new Error('Неизвестный тип заявки: '+type);
  }
}

/* ============================================================

   ============================================================ */
async function adminAction(type,payload){
  const sess=getSession();
  if(!sess||sess.user.role!=='admin')throw new Error('Только админ');
  const admin=sess.user;
  const ts=nowISO();

  const pushOp=async(op)=>{
    const id=uid();
    const full={id,ts,...op};
    const ops=getOps();ops.push(full);saveOps(ops);
    if(_fbReady)await fbSet('operations/'+id,full);
  };

  switch(type){
    case REQ_TYPE.ADMIN_ADD_TREASURY:{
      const amt=Number(payload.amount);
      if(!isFinite(amt)||amt<=0)throw new Error('Некорректная сумма');
      await pushOp({type:'contribute',userId:admin.id,userName:admin.fio,amount:amt,comment:'Админ: пополнение казны',byAdmin:true});
      break;
    }
    case REQ_TYPE.ADMIN_REMOVE_TREASURY:{
      const amt=Number(payload.amount);
      if(!isFinite(amt)||amt<=0)throw new Error('Некорректная сумма');
      if(getTreasuryBalance()<amt)throw new Error('В казне недостаточно средств');
      await pushOp({type:'admin_treasury_out',userId:admin.id,userName:admin.fio,amount:amt,comment:'Админ: изъятие из казны (не долг)',byAdmin:true});
      break;
    }
    case REQ_TYPE.ADMIN_ADD_PERSONAL:{
      const amt=Number(payload.amount);
      if(!isFinite(amt)||amt<=0)throw new Error('Некорректная сумма');
      await pushOp({type:'personal_deposit',userId:payload.targetUserId,userName:payload.targetUserName,amount:amt,comment:'Админ: пополнение личного счёта',byAdmin:true});
      break;
    }
    case REQ_TYPE.ADMIN_ADD_DEBT:{
      const amt=Number(payload.amount);
      if(!isFinite(amt)||amt<=0)throw new Error('Некорректная сумма');
      const due=new Date();due.setDate(due.getDate()+LOAN_TERM_DAYS);
      const loanId=uid();
      const loan={id:loanId,userId:payload.targetUserId,userName:payload.targetUserName,amount:amt,percent:0,takenAt:ts,dueDate:due.toISOString(),status:'active',byAdmin:true,comment:'Долг введён админом'};
      const loans=getLoans();loans.push(loan);saveLoans(loans);
      if(_fbReady)await fbSet('loans/'+loanId,loan);
      break;
    }
    case REQ_TYPE.ADMIN_CANCEL_DEBT:{
      const loan=getActiveLoan(payload.targetUserId);
      if(!loan)throw new Error('Нет активного долга');
      const loans=getLoans();const l=loans.find(x=>x.id===loan.id);
      if(l){l.status='cancelled';l.cancelledAt=ts;l.byAdmin=true;l.comment='Аннулировано админом'}
      saveLoans(loans);
      if(_fbReady)await fbUpdate('loans/'+loan.id,{status:'cancelled',cancelledAt:ts,byAdmin:true,comment:'Аннулировано админом'});
      break;
    }
    case REQ_TYPE.ADMIN_BLOCK_USER:{
      const users=getUsers();const u=users.find(x=>x.id===payload.targetUserId);
      if(!u)throw new Error('Пользователь не найден');
      u.blocked=true;u.blockedAt=ts;
      saveUsers(users);
      if(_fbReady)await fbUpdate('users/'+u.id,{blocked:true,blockedAt:ts});
      break;
    }
    case REQ_TYPE.ADMIN_BLOCK_CARD:{
      const card=getUserCard(payload.targetUserId);
      if(!card)throw new Error('Карта не найдена');
      const cards=getCards();const c=cards.find(x=>x.id===card.id);
      if(c)c.status='blocked';
      saveCards(cards);
      if(_fbReady)await fbUpdate('cards/'+card.id,{status:'blocked',blockedAt:ts});
      break;
    }
    case REQ_TYPE.ADMIN_RESET_ACCOUNT:{
      const loans=getLoans().filter(l=>l.userId===payload.targetUserId&&l.status==='active');
      for(const l of loans){
        l.status='cancelled';l.cancelledAt=ts;l.byAdmin=true;
        if(_fbReady)await fbUpdate('loans/'+l.id,{status:'cancelled',cancelledAt:ts,byAdmin:true});
      }
      saveLoans(getLoans());
      const bal=getPersonalBalance(payload.targetUserId);
      if(bal>0){
        await pushOp({type:'personal_withdraw',userId:payload.targetUserId,userName:payload.targetUserName,amount:bal,comment:'Админ: сброс личного счёта',byAdmin:true});
      }
      break;
    }
    default:throw new Error('Неизвестное действие: '+type);
  }
  toast('Операция выполнена.','ok');
}

function parseHash(){
  const h=location.hash.replace(/^#\/?/,'');
  const [path,qs]=h.split('?');
  const params=new URLSearchParams(qs||'');
  return {path:path||(getSession()?'index':'login'),params};
}
function navigate(path,params){
  let h='#/'+path;
  if(params){
    const q=new URLSearchParams(params).toString();
    if(q)h+='?'+q;
  }
  if(location.hash===h)route();
  else location.hash=h;
}

        <form id="regForm" style="display:none" novalidate>

            <div class="field" id="f-reg-pass"><label>Пароль (мин. 6)</label><input type="password" id="regPass" placeholder="••••••"><div class="err-msg"></div></div>

            <div class="err-msg"></div>

  const pinScreen=document.getElementById('pinScreen');
  const fullScreen=document.getElementById('fullScreen');
  let pinAttempts=ssGet(SS.pinFail,0)||0;
  let pinBuf='';

  function showPinUI(){
    pinScreen.style.display='block';fullScreen.style.display='none';
    if(rememberedUser){
      const ava=document.getElementById('pinAva');
      if(rememberedUser.avatar)ava.innerHTML=`<img src="${rememberedUser.avatar}" alt="">`;
      else ava.textContent=initials(rememberedUser.fio);
      document.getElementById('pinName').textContent=rememberedUser.fio;
    }
    updateDots();updateLock();
  }
  function showFullUI(){
    pinScreen.style.display='none';fullScreen.style.display='block';
    const t=document.getElementById('toPinFromFull');
    if(t)t.style.display=rememberedUser?'inline-block':'none';
  }
  function updateDots(){document.querySelectorAll('#pinDots .dot').forEach((d,i)=>d.classList.toggle('filled',i<pinBuf.length))}
  function updateLock(){
    const locked=pinAttempts>=3;
    document.getElementById('pinLocked').style.display=locked?'block':'none';
    document.getElementById('pinPad').style.display=locked?'none':'grid';
  }
  function shakeDots(){const d=document.getElementById('pinDots');d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),450)}
  function setFieldError(fId,msg){const f=document.getElementById(fId);if(f){f.classList.add('error');const m=f.querySelector('.err-msg');if(m)m.textContent=msg}}
  function clearErrors(){document.querySelectorAll('.field.error').forEach(f=>f.classList.remove('error'))}
  function showMsg(elId,text,type){
    const el=document.getElementById(elId);if(!el)return;
    el.innerHTML=text?`<div class="badge ${type==='err'?'red':'green'}" style="display:block;margin-bottom:12px;padding:10px 14px;border-radius:10px">${esc(text)}</div>`:'';
  }

  async function doLoginSuccess(user){
    setSession(user.id);
    ssDel(SS.pinFail);

    // Захват сессии админа
    if(user.role==='admin'){
      const mySess=uid();
      ssSet(SS.adminSessionId,mySess);
      try{
        await claimAdminSession(mySess);
      }catch(e){
        clearSession();
        ssDel(SS.adminSessionId);
        toast(e.message,'err');
        showFullUI();
        return;
      }
    }

    const firstName=user.name||user.lastname||(user.fio||'').split(' ')[0]||'друг';
    await showLoadingScreen(firstName);
    navigate('index');
  }

  if(showPin)showPinUI();

  document.getElementById('pinPad').addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k;
    if(k==='switch'){showFullUI();return}
    if(k==='del'){pinBuf=pinBuf.slice(0,-1);updateDots();return}
    if(pinAttempts>=3)return;
    if(pinBuf.length>=5)return;
    pinBuf+=k;updateDots();
    if(pinBuf.length===5){
      const pin=pinBuf;
      if(!rememberedUser||!rememberedUser.pin){shakeDots();pinBuf='';updateDots();return}
      if(verifyHash(pin,rememberedUser.pin.salt,rememberedUser.pin.hash)){
        if(!isApproved(rememberedUser)||rememberedUser.blocked){
          shakeDots();
          showMsg('loginMsg',rememberedUser.blocked?'Аккаунт заблокирован администратором.':'Заявка ещё на рассмотрении.','err');
          pinBuf='';updateDots();
          return;
        }
        await doLoginSuccess(rememberedUser);
      }else{
        shakeDots();
        pinAttempts++;ssSet(SS.pinFail,pinAttempts);
        pinBuf='';updateDots();updateLock();
        if(pinAttempts>=3)toast('Быстрый вход заблокирован. Выполните полный вход.','err');
      }
    }
  });

  document.getElementById('toFullFromPin').addEventListener('click',showFullUI);
  const tp=document.getElementById('toPinFromFull');
  if(tp)tp.addEventListener('click',showPinUI);

  document.getElementById('authTabs').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    document.querySelectorAll('#authTabs button').forEach(x=>x.classList.toggle('active',x===b));
    document.getElementById('loginForm').style.display=b.dataset.tab==='login'?'block':'none';
    document.getElementById('regForm').style.display=b.dataset.tab==='register'?'block':'none';
  });

  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    clearErrors();showMsg('loginMsg','');
    const email=document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass=document.getElementById('loginPass').value;
    let err=false;
    if(!email){setFieldError('f-login-email','Введите email.');err=true}
    else if(!isEmailGmail(email)){setFieldError('f-login-email','Email должен быть @gmail.com.');err=true}
    if(!pass){setFieldError('f-login-pass','Введите пароль.');err=true}
    if(err)return;

    // Пытаемся сначала подтянуть свежие данные из Firebase
    try{await syncFromFirebase()}catch(e){}

    const u=getUserByEmail(email);
    if(!u){showMsg('loginMsg','Пользователь с таким email не найден.','err');return}
    if(!verifyHash(pass,u.pass.salt,u.pass.hash)){showMsg('loginMsg','Неверный пароль.','err');return}
    if(u.blocked){showMsg('loginMsg','Аккаунт заблокирован администратором.','err');return}
    if(!isApproved(u)){
      showMsg('loginMsg',u.status==='pending'?'Ваша заявка ещё на рассмотрении администратором.':'Ваша заявка отклонена.','err');
      return;
    }
    await doLoginSuccess(u);
  });

  document.getElementById('regForm').addEventListener('submit',async e=>{
    e.preventDefault();
    clearErrors();showMsg('regMsg','');
    const lastname=document.getElementById('regLastname').value.trim();
    const name=document.getElementById('regName').value.trim();
    const patronymic=document.getElementById('regPatronymic').value.trim();
    const email=document.getElementById('regEmail').value.trim().toLowerCase();
    const pass=document.getElementById('regPass').value;
    const pass2=document.getElementById('regPass2').value;
    const pin=document.getElementById('regPin').value;
    let err=false;
    if(!lastname){setFieldError('f-reg-lastname','Введите фамилию.');err=true}
    if(!name){setFieldError('f-reg-name','Введите имя.');err=true}
    if(!patronymic){setFieldError('f-reg-patronymic','Введите отчество.');err=true}
    if(!email){setFieldError('f-reg-email','Введите email.');err=true}
    else if(!isEmailGmail(email)){setFieldError('f-reg-email','Email должен быть @gmail.com.');err=true}
    else if(getUserByEmail(email)){setFieldError('f-reg-email','Этот email уже занят.');err=true}
    if(!pass){setFieldError('f-reg-pass','Введите пароль.');err=true}
    else if(pass.length<6){setFieldError('f-reg-pass','Минимум 6 символов.');err=true}
    if(!pass2){setFieldError('f-reg-pass2','Повторите пароль.');err=true}
    else if(pass!==pass2){setFieldError('f-reg-pass2','Пароли не совпадают.');err=true}
    if(!isPin5(pin)){setFieldError('f-reg-pin','PIN — ровно 5 цифр.');err=true}
    if(err)return;

    const users=getUsers();
    const isFirst=users.length===0;
    const u={
      id:uid(),lastname,name,patronymic,
      fio:`${lastname} ${name} ${patronymic}`,
      email,
      pass:makeHash(pass),pin:makeHash(pin),
      avatar:'',
      role:isFirst?'admin':'member',
      status:isFirst?'active':'pending',
      blocked:false,
      createdAt:nowISO()
    };
    users.push(u);saveUsers(users);
    if(_fbReady)await fbSet('users/'+u.id,u);

    if(isFirst){
      showMsg('regMsg','Администратор зарегистрирован! Войдите.','ok');
      setTimeout(()=>{
        document.querySelector('#authTabs button[data-tab="login"]').click();
        document.getElementById('loginEmail').value=email;
        document.getElementById('loginPass').focus();
      },900);
    }else{
      showMsg('regMsg','Заявка отправлена на рассмотрение администратору.','ok');
      document.getElementById('regForm').reset();
    }
  });
}

  $('btnDoReturn').addEventListener('click',async()=>{
    if(!currentReturn)return;
    const loan=currentReturn;
    const total=loan.amount+Math.round(loan.amount*(loan.percent||0)/100);
    const bal=getPersonalBalance(me.id);
    if(total>bal){toast('Недостаточно на личном счёте. Нужно: '+fmtMoney(total)+', доступно: '+fmtMoney(bal),'err');return}
    try{
      await createRequest(REQ_TYPE.RETURN_LOAN,{amount:total});
      currentReturn=null;
      closeModal('returnModal');
    }catch(e){toast(e.message,'err')}
  });

  function renderOps(){
    const tbody=document.querySelector('#opsTable tbody');
    const filtered=getOps().slice().reverse().filter(o=>['contribute','loan_out','loan_return','personal_to_treasury','admin_treasury_out'].includes(o.type));
    tbody.innerHTML='';
    if(!filtered.length){$('opsEmpty').style.display='block';$('opsTable').style.display='none';return}
    $('opsEmpty').style.display='none';$('opsTable').style.display='table';
    const labels={contribute:'Взнос в казну',loan_out:'Выдача займа',loan_return:'Возврат займа',personal_to_treasury:'Перевод с личного',admin_treasury_out:'Изъятие из казны (админ)'};
    filtered.forEach(op=>{
      const tr=document.createElement('tr');
      const sign=(op.type==='contribute'||op.type==='loan_return'||op.type==='personal_to_treasury')?'+':'−';
      const cls=sign==='+'?'amt-in':'amt-out';
      tr.innerHTML=`<td>${fmtDateTime(op.ts)}</td><td>${esc(op.userName||'')}</td><td>${labels[op.type]||op.type}</td><td class="${cls}">${sign} ${fmtMoney(op.amount)}</td>`;
      tbody.appendChild(tr);
    });
  }

  /* ===== Админ-панель ===== */
  let _commentCtx=null;
  function renderAdminReqs(){
    const tbody=document.querySelector('#adminReqsTable tbody');
    if(!tbody)return;
    
    // 1. Обычные заявки на операции
    let reqs = getRequests().filter(r=>r.status==='pending').reverse();
    
    // 2. Заявки на регистрацию (пользователи со статусом pending)
    const pendingUsers = getUsers().filter(u => u.status === 'pending');
    
    tbody.innerHTML='';
    
    if(!reqs.length && !pendingUsers.length){
      $('adminReqsEmpty').style.display='block';
      $('adminReqsTable').style.display='none';
      return;
    }
    $('adminReqsEmpty').style.display='none';
    $('adminReqsTable').style.display='table';

    // Рендерим пользователей
    pendingUsers.forEach(u => {
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td>${fmtDateTime(u.createdAt)}</td>
        <td>${esc(u.fio)}</td>
        <td>Регистрация</td>
        <td>—</td>
        <td>
          <button class="btn green small" data-ap-user="${u.id}">✔</button>
          <button class="btn red small" data-rj-user="${u.id}" style="margin-left:4px">✖</button>
        </td>`;
      tbody.appendChild(tr);
    });

    // Рендерим обычные операции
    reqs.forEach(r=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td>${fmtDateTime(r.createdAt)}</td>
        <td>${esc(r.userName)}</td>
        <td>${REQ_LABELS[r.type]||r.type}</td>
        <td>${(r.payload && r.payload.amount) ? fmtMoney(r.payload.amount) : '—'}</td>
        <td>
          <button class="btn green small" data-ap="${r.id}">✔</button>
          <button class="btn red small" data-rj="${r.id}" style="margin-left:4px">✖</button>
        </td>`;
      tbody.appendChild(tr);
    });

    // Обработчики для пользователей (регистрация)
    tbody.querySelectorAll('[data-ap-user]').forEach(b=>b.addEventListener('click',async ()=>{
      const userId = b.dataset.apUser;
      const users = getUsers();
      const user = users.find(x => x.id === userId);
      if(user) {
       user.status = 'active';
       saveUsers(users);
       if(_fbReady) await fbUpdate('users/'+userId, {status: 'active'});
       toast('Пользователь одобрен.', 'ok');
      }
    }));
    
    tbody.querySelectorAll('[data-rj-user]').forEach(b=>b.addEventListener('click',async ()=>{
      const userId = b.dataset.rjUser;
      const users = getUsers();
      const user = users.find(x => x.id === userId);
      if(user) {
        user.status = 'rejected';
        saveUsers(users);
        if(_fbReady) await fbUpdate('users/'+userId, {status: 'rejected'});
        toast('Пользователь отклонён.', 'ok');
        renderAll();
      }
    }));

    // Обработчики для обычных заявок
    tbody.querySelectorAll('[data-ap]').forEach(b=>b.addEventListener('click',()=>{
      _commentCtx={reqId:b.dataset.ap,action:'approve'};
      document.querySelectorAll('input[name="cmt"]').forEach(r=>r.checked=false);
      document.querySelector('input[name="cmt"][value="ok"]').checked=true;
      openModal('commentModal');
    }));
    tbody.querySelectorAll('[data-rj]').forEach(b=>b.addEventListener('click',()=>{
      _commentCtx={reqId:b.dataset.rj,action:'reject'};
      document.querySelectorAll('input[name="cmt"]').forEach(r=>r.checked=false);
      document.querySelector('input[name="cmt"][value="noMoney"]').checked=true;
      openModal('commentModal');
    }));
}
  document.addEventListener('click',async e=>{
    if(e.target.id!=='btnCommentConfirm')return;
    const val=document.querySelector('input[name="cmt"]:checked').value;
    const ctx=_commentCtx;
    if(!ctx)return;
    closeModal('commentModal');
    try{
      if(ctx.action==='approve')await approveRequest(ctx.reqId,val);
      else await rejectRequest(ctx.reqId,val);
      renderAll();
    }catch(err){toast(err.message,'err')}
  });

  if(isAdmin){
    // Участники в select
    const sel=$('admTargetUser');
    if(sel){
      getUsers().filter(u=>u.id!==me.id).forEach(u=>{
        const opt=document.createElement('option');
        opt.value=u.id;opt.textContent=u.fio;
        sel.appendChild(opt);
      });
    }

    // Техработы
    async function updateMaintStatus(){
      const m=await getMaintenance();
      $('maintStatus').textContent=m&&m.enabled?'⚠️ Включены: '+(m.comment||''):'✅ Выключены';
    }
    updateMaintStatus();

    $('btnMaintOn').addEventListener('click',async()=>{
      const c=$('maintComment').value.trim()||'Скоро вернёмся!';
      await setMaintenanceMode(true,c);
      toast('Техработы включены.','ok');
      updateMaintStatus();
    });
    $('btnMaintOff').addEventListener('click',async()=>{
      await setMaintenanceMode(false,'');
      toast('Техработы выключены.','ok');
      updateMaintStatus();
    });

    // Казна
    $('btnAdmAddTreasury').addEventListener('click',async()=>{
      try{await adminAction(REQ_TYPE.ADMIN_ADD_TREASURY,{amount:Number($('admTreasAmount').value)});renderAll()}
      catch(e){toast(e.message,'err')}
    });
    $('btnAdmRemoveTreasury').addEventListener('click',async()=>{
      try{await adminAction(REQ_TYPE.ADMIN_REMOVE_TREASURY,{amount:Number($('admTreasAmount').value)});renderAll()}
      catch(e){toast(e.message,'err')}
    });

    // Участник
    const getTarget=()=>{
      const id=$('admTargetUser').value;const u=getUserById(id);
      return u?{targetUserId:u.id,targetUserName:u.fio}:null;
    };
    $('btnAdmAddPersonal').addEventListener('click',async()=>{
      const t=getTarget();if(!t)return;
      try{await adminAction(REQ_TYPE.ADMIN_ADD_PERSONAL,{...t,amount:Number($('admUserAmount').value)});renderAll()}
      catch(e){toast(e.message,'err')}
    });
    $('btnAdmAddDebt').addEventListener('click',async()=>{
      const t=getTarget();if(!t)return;
      try{await adminAction(REQ_TYPE.ADMIN_ADD_DEBT,{...t,amount:Number($('admUserAmount').value)});renderAll()}
      catch(e){toast(e.message,'err')}
    });
    $('btnAdmCancelDebt').addEventListener('click',async()=>{
      const t=getTarget();if(!t)return;
      try{await adminAction(REQ_TYPE.ADMIN_CANCEL_DEBT,t);renderAll()}
      catch(e){toast(e.message,'err')}
    });
    $('btnAdmBlockUser').addEventListener('click',async()=>{
      const t=getTarget();if(!t)return;
      if(!confirm('Заблокировать аккаунт?'))return;
      try{await adminAction(REQ_TYPE.ADMIN_BLOCK_USER,t);renderAll()}
      catch(e){toast(e.message,'err')}
    });
    $('btnAdmBlockCard').addEventListener('click',async()=>{
      const t=getTarget();if(!t)return;
      try{await adminAction(REQ_TYPE.ADMIN_BLOCK_CARD,t);renderAll()}
      catch(e){toast(e.message,'err')}
    });
    $('btnAdmResetAccount').addEventListener('click',async()=>{
      const t=getTarget();if(!t)return;
      if(!confirm('Сбросить личный счёт и все долги?'))return;
      try{await adminAction(REQ_TYPE.ADMIN_RESET_ACCOUNT,t);renderAll()}
      catch(e){toast(e.message,'err')}
    });
  }

  function renderAll(){
    renderTreasury();renderMembers();renderOps();
    if(isAdmin)renderAdminReqs();
  }
  renderAll();
}

   ЛИЧНЫЙ СЧЁТ

async function renderPersonal(){
  const sess=getSession();if(!sess)return;
  const me=sess.user;

  document.getElementById('app').innerHTML=shell('personal',`

    <div id="pendingNote" class="card center" style="display:none;background:#fff9e5">
      <div class="badge blue">Есть заявка на рассмотрении</div>
    </div>
    <div id="noAccount" class="card center" style="display:none">

      <button class="btn" id="btnOpenAccount">Открыть личный счёт</button>
    </div>
    <div id="accountBox" style="display:none">
      <div class="card center">
        <div class="text-muted">Баланс личного счёта</div>
        <div style="font-size:36px;font-weight:700;margin:8px 0;color:#2c3e50" id="personalBalance">0 ₽</div>
        <div class="btn-row" style="justify-content:center">
          <button class="btn green" id="btnDeposit">Положить</button>
          <button class="btn" id="btnWithdraw">Снять</button>
          <button class="btn" id="btnToTreasury">В общую казну</button>
        </div>
      </div>

      <div class="table-wrap card" style="padding:0">
        <table class="tbl" id="personalOpsTable"><thead><tr><th>Дата</th><th>Операция</th><th>Сумма</th></tr></thead><tbody></tbody></table>
        <div class="empty-note" id="personalOpsEmpty" style="display:none">Пока нет операций</div>
      </div>
    </div>

    <div class="modal-overlay" id="depositModal"><div class="modal">
      <button class="close-x" onclick="closeModal('depositModal')">✕</button>
      <h3>Положить на личный счёт</h3>
      <div class="field"><label>Сумма (₽)</label><input type="number" id="depositAmount" min="1" placeholder="Сумма"></div>
      <button class="btn green block" id="btnDoDeposit">Отправить заявку</button>
    </div></div>

    <div class="modal-overlay" id="withdrawModal"><div class="modal">
      <button class="close-x" onclick="closeModal('withdrawModal')">✕</button>
      <h3>Снять с личного счёта</h3>
      <div class="field"><label>Сумма (₽)</label><input type="number" id="withdrawAmount" min="1" placeholder="Сумма"><div class="hint" id="withdrawHint"></div></div>
      <button class="btn red block" id="btnDoWithdraw">Отправить заявку</button>
    </div></div>

    <div class="modal-overlay" id="toTreasuryModal"><div class="modal">
      <button class="close-x" onclick="closeModal('toTreasuryModal')">✕</button>
      <h3>Перевести в общую казну</h3>
      <div class="field"><label>Сумма (₽)</label><input type="number" id="toTreasuryAmount" min="1" placeholder="Сумма"><div class="hint" id="toTreasuryHint"></div></div>
      <button class="btn block" id="btnDoToTreasury">Отправить заявку</button>
    </div></div>
  `);

  bindShell('personal');startIdle();
  const $=id=>document.getElementById(id);

  function hasAccount(){
    return getOps().some(o=>o.userId===me.id&&['personal_deposit','personal_withdraw','personal_to_treasury'].includes(o.type));
  }
  function hasPending(){
    return getRequests().some(r=>r.userId===me.id&&r.status==='pending'&&
      ['personal_deposit','personal_withdraw','personal_to_treasury','contribute_to_treasury'].includes(r.type));
  }
  function render(){
    if(!hasAccount()){
      $('noAccount').style.display='block';$('accountBox').style.display='none';
    }else{
      $('noAccount').style.display='none';$('accountBox').style.display='block';
      $('personalBalance').textContent=fmtMoney(getPersonalBalance(me.id));
      renderOps();
    }
    $('pendingNote').style.display=hasPending()?'block':'none';
  }
  function renderOps(){
    const ops=getOps().filter(o=>o.userId===me.id&&['personal_deposit','personal_withdraw','personal_to_treasury'].includes(o.type)).reverse();
    const tbody=document.querySelector('#personalOpsTable tbody');tbody.innerHTML='';
    if(!ops.length){$('personalOpsEmpty').style.display='block';$('personalOpsTable').style.display='none';return}
    $('personalOpsEmpty').style.display='none';$('personalOpsTable').style.display='table';
    const labels={personal_deposit:'Пополнение',personal_withdraw:'Снятие',personal_to_treasury:'Перевод в казну'};
    ops.forEach(op=>{
      const isIn=op.type==='personal_deposit';
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${fmtDateTime(op.ts)}</td><td>${labels[op.type]||op.type}</td><td class="${isIn?'amt-in':'amt-out'}">${isIn?'+':'−'} ${fmtMoney(op.amount)}</td>`;
      tbody.appendChild(tr);
    });
  }

  $('btnOpenAccount').addEventListener('click',()=>{$('depositAmount').value='';openModal('depositModal')});
  $('btnDeposit').addEventListener('click',()=>{$('depositAmount').value='';openModal('depositModal')});
  $('btnWithdraw').addEventListener('click',()=>{
    $('withdrawHint').textContent='Доступно: '+fmtMoney(getPersonalBalance(me.id));
    $('withdrawAmount').value='';openModal('withdrawModal');
  });
  $('btnToTreasury').addEventListener('click',()=>{
    $('toTreasuryHint').textContent='Доступно: '+fmtMoney(getPersonalBalance(me.id));
    $('toTreasuryAmount').value='';openModal('toTreasuryModal');
  });

  $('btnDoDeposit').addEventListener('click',async()=>{
    const v=Number($('depositAmount').value);
    if(!isFinite(v)||v<=0){toast('Введите корректную сумму.','err');return}
    try{await createRequest(REQ_TYPE.PERSONAL_DEPOSIT,{amount:v});closeModal('depositModal');render()}
    catch(e){toast(e.message,'err')}
  });
  $('btnDoWithdraw').addEventListener('click',async()=>{
    const v=Number($('withdrawAmount').value);
    if(!isFinite(v)||v<=0){toast('Введите корректную сумму.','err');return}
    try{await createRequest(REQ_TYPE.PERSONAL_WITHDRAW,{amount:v});closeModal('withdrawModal');render()}
    catch(e){toast(e.message,'err')}
  });
  $('btnDoToTreasury').addEventListener('click',async()=>{
    const v=Number($('toTreasuryAmount').value);
    if(!isFinite(v)||v<=0){toast('Введите корректную сумму.','err');return}
    try{await createRequest(REQ_TYPE.PERSONAL_TO_TREASURY,{amount:v});closeModal('toTreasuryModal');render()}
    catch(e){toast(e.message,'err')}
  });

  render();
}

/* ============================================================
   КАРТА
   ============================================================ */
async function renderCard(){
  const sess=getSession();if(!sess)return;
  const me=sess.user;

  document.getElementById('app').innerHTML=shell('card',`
    <h2 class="page-title">Карта участника</h2>
    <div id="pendingCardNote" class="card center" style="display:none;background:#fff9e5">
      <div class="badge blue">Заявка на карту на рассмотрении</div>
    </div>
    <div id="noCard" class="card center" style="display:none">
      <p>У вас ещё нет карты участника кассы.</p>
      <button class="btn" id="btnIssueCard">Оформить карту</button>
    </div>
    <div id="cardBox" style="display:none">
      <div class="bank-card" id="bankCard">
        <div class="qr-side" id="qrSide"></div>
        <div class="data-side">
          <div class="card-title">Удостоверение участника</div>
          <div class="card-org">УПФ · УралПромФонд</div>
          <div class="card-fio" id="cardFio">—</div>
          <div class="card-num" id="cardNum">0000 0000 00</div>
          <div class="card-cvv">Код: <b id="cardCode">000</b></div>
        </div>
      </div>
      <div class="btn-row"><button class="btn red" id="btnBlockCard">Запросить блокировку</button></div>
      <p class="text-muted mt-10">Карта — удостоверение участника кассы, не платёжный инструмент.</p>
    </div>

    ${me.role==='admin'?`
    <div id="adminPanel">
      <h3 class="section-title">Отделение: вход по карте</h3>
      <div class="card">
        <p class="text-muted">Отсканируйте QR или введите номер и трёхзначный код.</p>
        <div class="row-2">
          <div class="field"><label>Номер карты (10 цифр)</label><input type="text" id="scanNumber" maxlength="10" inputmode="numeric" placeholder="0000000000"></div>
          <div class="field"><label>Трёхзначный код</label><input type="text" id="scanCode" maxlength="3" inputmode="numeric" placeholder="000"></div>
        </div>
        <button class="btn" id="btnScanCard">Открыть карточку</button>
      </div>
    </div>`:''}

    <div class="modal-overlay" id="adminOpsModal"><div class="modal">
      <button class="close-x" onclick="closeModal('adminOpsModal')">✕</button>
      <h3 id="adminOpsTitle">Операции</h3>
      <div id="adminOpsBody"></div>
    </div></div>
  `);

  bindShell('card');startIdle();
  const $=id=>document.getElementById(id);

  function render(){
    const card=getUserCard(me.id);
    if(!card){
      $('noCard').style.display='block';$('cardBox').style.display='none';
    }else{
      $('noCard').style.display='none';$('cardBox').style.display='block';
      $('cardFio').textContent=me.fio;
      const n=card.number;
      $('cardNum').textContent=n.slice(0,4)+' '+n.slice(4,8)+' '+n.slice(8,10);
      $('cardCode').textContent=card.code;
      $('bankCard').classList.toggle('blocked',card.status==='blocked');
      drawQR($('qrSide'),JSON.stringify({n:card.number,c:card.code,f:me.fio.slice(0,20)}));
    }
    const hasPendingCard=getRequests().some(r=>r.userId===me.id&&r.status==='pending'&&['issue_card','block_card'].includes(r.type));
    $('pendingCardNote').style.display=hasPendingCard?'block':'none';
  }

  $('btnIssueCard').addEventListener('click',async()=>{
    try{await createRequest(REQ_TYPE.ISSUE_CARD,{});render()}
    catch(e){toast(e.message,'err')}
  });
  $('btnBlockCard').addEventListener('click',async()=>{
    try{await createRequest(REQ_TYPE.BLOCK_CARD,{});render()}
    catch(e){toast(e.message,'err')}
  });

  if(me.role==='admin'){
    $('btnScanCard').addEventListener('click',()=>{
      const num=$('scanNumber').value.trim();
      const code=$('scanCode').value.trim();
      if(!/^\d{10}$/.test(num)){toast('Номер карты — 10 цифр.','err');return}
      if(!/^\d{3}$/.test(code)){toast('Код — 3 цифры.','err');return}
      const card=getCards().find(c=>c.number===num&&c.code===code);
      if(!card){toast('Карта не найдена или код неверный.','err');return}
      if(card.status==='blocked'){toast('Карта заблокирована.','err');return}
      const user=getUserById(card.userId);
      if(!user){toast('Владелец не найден.','err');return}
      const contributed=getUserContributed(user.id);
      const loan=getActiveLoan(user.id);
      const total=loan?loan.amount+Math.round(loan.amount*(loan.percent||0)/100):0;
      $('adminOpsTitle').textContent='Участник: '+user.fio;
      $('adminOpsBody').innerHTML=`
        <div class="card" style="box-shadow:none;background:#f7fbff;padding:16px">
          <div style="font-size:17px;font-weight:700">${esc(user.fio)}</div>
          <div class="text-muted">${esc(user.email)}</div>
          <div style="margin:10px 0">
            <span class="badge blue">вклад: ${fmtMoney(contributed)}</span>
            <span class="badge ${loan?'red':'green'}" style="margin-left:6px">заём: ${loan?fmtMoney(total)+' (до '+fmtDate(loan.dueDate)+')':'нет'}</span>
          </div>
          <div class="btn-row">
            <button class="btn green small" id="admScanAdd">Внести в казну</button>
            ${loan?`<button class="btn red small" id="admScanReturn">Принять возврат</button>`:''}
          </div>
        </div>`;
      openModal('adminOpsModal');

      const addBtn=$('admScanAdd');
      if(addBtn)addBtn.addEventListener('click',async()=>{
        const v=Number(prompt('Сумма взноса (100–5000 ₽):','500'));
        if(!isFinite(v)||v<100||v>5000){toast('Сумма 100–5000 ₽.','err');return}
        const bal=getPersonalBalance(user.id);
        if(v>bal){toast('У пользователя недостаточно на личном счёте.','err');return}
        await adminAction(REQ_TYPE.ADMIN_ADD_PERSONAL,{targetUserId:user.id,targetUserName:user.fio,amount:v});
        await adminAction(REQ_TYPE.ADMIN_REMOVE_TREASURY,{amount:v});
        closeModal('adminOpsModal');
      });
      const retBtn=$('admScanReturn');
      if(retBtn)retBtn.addEventListener('click',async()=>{
        try{await adminAction(REQ_TYPE.ADMIN_CANCEL_DEBT,{targetUserId:user.id,targetUserName:user.fio});closeModal('adminOpsModal')}
        catch(e){toast(e.message,'err')}
      });
    });
  }

  render();
}

        </div>
      </div>
      <h3 style="margin:20px 0 4px" id="profileFio">—</h3>
      <p class="text-muted" id="profileEmail" style="margin:0">—</p>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Изменить ФИО</h3>
      <div class="row-2">
        <div class="field"><label>Фамилия</label><input type="text" id="chLastname"></div>
        <div class="field"><label>Имя</label><input type="text" id="chName"></div>
      </div>
      <div class="field"><label>Отчество</label><input type="text" id="chPatronymic"></div>
      <button class="btn" id="btnChangeFio">Сохранить ФИО</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Сменить пароль</h3>
      <div class="field"><label>Старый пароль</label><input type="password" id="oldPass"></div>
      <div class="field"><label>Новый пароль (мин. 6)</label><input type="password" id="newPass"></div>
      <button class="btn" id="btnChangePass">Сменить пароль</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Сменить email</h3>
      <div class="field"><label>Новый email (@gmail.com)</label><input type="email" id="newEmail" placeholder="new@gmail.com"></div>
      <div class="field"><label>Способ подтверждения</label>
        <select id="emailMode">
          <option value="code">Код-симуляция (6-значный код)</option>
          <option value="branch">В отделении (одобрение администратора)</option>
        </select>
      </div>
      <button class="btn" id="btnChangeEmail">Сменить email</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Сменить PIN-код</h3>
      <div class="field"><label>Текущий пароль</label><input type="password" id="pinPass"></div>
      <div class="field"><label>Новый PIN (5 цифр)</label><input type="password" id="newPin" maxlength="5" inputmode="numeric"></div>
      <button class="btn" id="btnChangePin">Сменить PIN</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Карта участника</h3>
      <p class="text-muted">Оформите карту-удостоверение участника кассы.</p>
      <button class="btn" id="btnGoCard">Перейти к карте</button>
    </div>

    <div class="modal-overlay" id="codeModal"><div class="modal">
      <button class="close-x" onclick="closeModal('codeModal')">✕</button>
      <h3>Подтверждение email</h3>
      <p class="text-muted">Введите 6-значный код (симуляция).</p>
      <div class="field"><label>Код</label><input type="text" id="emailCode" maxlength="6" inputmode="numeric" placeholder="000000"></div>
      <button class="btn green block" id="btnConfirmEmailCode">Подтвердить</button>
    </div></div>
  `);

  bindShell('account');startIdle();
  const $=id=>document.getElementById(id);

  function renderProfile(){
    const prev=$('avatarPreview');
    if(me.avatar)prev.innerHTML=`<img src="${me.avatar}" alt="">`;
    else prev.textContent=initials(me.fio);
    $('profileFio').textContent=me.fio;
    $('profileEmail').textContent=me.email;
    $('chLastname').value=me.lastname||'';
    $('chName').value=me.name||'';
    $('chPatronymic').value=me.patronymic||'';
  }
  renderProfile();

  $('btnAvatar').addEventListener('click',()=>$('avatarInput').click());
  $('avatarInput').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    if(!f.type.startsWith('image/')){toast('Выберите изображение.','err');return}
    cropAvatar(f,200,async dataUrl=>{
      const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return;
      u.avatar=dataUrl;saveUsers(users);
      if(_fbReady)await fbUpdate('users/'+u.id,{avatar:dataUrl});
      me=getUserById(me.id);
      renderProfile();toast('Аватар обновлён.','ok');
    });
  });

  $('btnChangeFio').addEventListener('click',async()=>{
    const lastname=$('chLastname').value.trim();
    const name=$('chName').value.trim();
    const patronymic=$('chPatronymic').value.trim();
    if(!lastname||!name||!patronymic){toast('Заполните все поля.','err');return}
    const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return;
    u.lastname=lastname;u.name=name;u.patronymic=patronymic;
    u.fio=`${lastname} ${name} ${patronymic}`;
    saveUsers(users);
    if(_fbReady)await fbUpdate('users/'+u.id,{lastname,name,patronymic,fio:u.fio});
    me=getUserById(me.id);
    renderProfile();toast('ФИО изменено.','ok');
  });

  $('btnChangePass').addEventListener('click',async()=>{
    const oldP=$('oldPass').value,newP=$('newPass').value;
    if(!oldP){toast('Введите старый пароль.','err');return}
    if(newP.length<6){toast('Новый пароль — минимум 6 символов.','err');return}
    if(!verifyHash(oldP,me.pass.salt,me.pass.hash)){toast('Неверный старый пароль.','err');return}
    const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return;
    u.pass=makeHash(newP);saveUsers(users);
    if(_fbReady)await fbUpdate('users/'+u.id,{pass:u.pass});
    me=getUserById(me.id);
    $('oldPass').value='';$('newPass').value='';
    toast('Пароль изменён.','ok');
  });

  let pendingEmail=null;
  $('btnChangeEmail').addEventListener('click',async()=>{
    const email=$('newEmail').value.trim().toLowerCase();
    if(!isEmailGmail(email)){toast('Email должен быть @gmail.com.','err');return}
    if(getUserByEmail(email)){toast('Этот email уже занят.','err');return}
    const mode=$('emailMode').value;
    if(mode==='branch'){
      addRequest({type:'change_email',userId:me.id,userName:me.fio,newEmail:email});
      if(_fbReady)await fbPush('requests',{type:'change_email',userId:me.id,userName:me.fio,payload:{newEmail:email},status:'pending',createdAt:nowISO()});
      toast('Заявка отправлена администратору.','ok');
      $('newEmail').value='';
      return;
    }
    pendingEmail=email;
    const code=randomDigits(6);
    ssSet(SS.emailCode,code);
    $('emailCode').value='';
    openModal('codeModal');
    setTimeout(()=>toast('Код (симуляция): '+code,'ok'),300);
  });
  $('btnConfirmEmailCode').addEventListener('click',async()=>{
    const entered=$('emailCode').value.trim();
    const real=ssGet(SS.emailCode,'');
    if(!real||entered!==real){toast('Неверный код.','err');return}
    if(!pendingEmail){toast('Нет данных.','err');return}
    const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return;
    u.email=pendingEmail;saveUsers(users);
    if(_fbReady)await fbUpdate('users/'+u.id,{email:pendingEmail});
    me=getUserById(me.id);
    ssDel(SS.emailCode);pendingEmail=null;
    closeModal('codeModal');$('newEmail').value='';
    renderProfile();toast('Email изменён.','ok');
  });

  $('btnChangePin').addEventListener('click',async()=>{
    const pass=$('pinPass').value,pin=$('newPin').value;
    if(!pass){toast('Введите пароль.','err');return}
    if(!isPin5(pin)){toast('PIN — ровно 5 цифр.','err');return}
    if(!verifyHash(pass,me.pass.salt,me.pass.hash)){toast('Неверный пароль.','err');return}
    const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return;
    u.pin=makeHash(pin);saveUsers(users);
    if(_fbReady)await fbUpdate('users/'+u.id,{pin:u.pin});
    me=getUserById(me.id);
    $('pinPass').value='';$('newPin').value='';
    toast('PIN-код изменён.','ok');
  });

  $('btnGoCard').addEventListener('click',()=>navigate('card'));
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
(async function init(){
  // Конфиг
  if(!lsGet(LS.config,null)){
    lsSet(LS.config,{loanPercent:LOAN_PERCENT,loanTermDays:LOAN_TERM_DAYS});
  }

  // Firebase: авторизация + подтягивание данных + создание админа
  try{
    await ensureFirebaseAuth();
    await syncFromFirebase();
    await ensureAdminExists();
    // повторная синхронизация после возможного создания админа
    await syncFromFirebase();
    startRealtimeSync();
  }catch(e){
    console.warn('Firebase недоступен, работаем в локальном режиме:',e.message);
  }

  // Роутер
  if(!location.hash)location.replace('#/login');
  await route();
})();
</script>
