<style>
:root {
  --sber-green: #21A038;
  --sber-green-bg: #e5f5e9;
  --bg: #f2f3f5;
  --card-bg: #ffffff;
  --text-main: #1a1a1a;
  --text-muted: #7a7a7a;
  --border: #e5e6e8;
  --input-bg: #f2f3f5;
  --shadow: 0 4px 20px rgba(0,0,0,0.04);
  --red: #ff3b30;
  --red-bg: #fff5f5;
  --radius: 20px;
}
[data-theme="dark"] {
  --bg: #0f0f11;
  --card-bg: #1c1c1e;
  --text-main: #ffffff;
  --text-muted: #8e8e93;
  --border: #2c2c2e;
  --input-bg: #2c2c2e;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --sber-green-bg: #1c3b24;
  --red-bg: #3b1c1c;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;font-family:'Inter', sans-serif;background:var(--bg);color:var(--text-main);-webkit-font-smoothing:antialiased;min-height:100%;transition: background .3s;}
body{display:flex;flex-direction:column;min-height:100vh; padding-bottom: 70px;}

header.topbar{background: var(--card-bg); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border);}
header.topbar h1{font-size:16px;margin:0;font-weight:600;}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-left:auto;}

main.page{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:16px; animation: fadeIn 0.3s ease both;}
h2.page-title{font-size:24px;margin:8px 0 16px;font-weight:700;}

.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:none; animation: fadeIn 0.4s ease both;}
.card+.card{margin-top:12px;}
.section-title{font-size:18px;margin:24px 0 12px;font-weight:600;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 24px;border:none;border-radius:12px;font-size:15px;font-weight:600;
  cursor:pointer;color:#fff; font-family:inherit; transition:transform .1s, opacity .2s;
  background: var(--sber-green);
}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.ghost{background:var(--input-bg);color:var(--text-main);}
.btn.neutral{background:var(--input-bg);color:var(--text-main);border:none;}
.btn.red{background:var(--red);}
.btn.small{padding:8px 14px;font-size:13px;border-radius:8px;}
.btn.block{width:100%;}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;font-weight:500;}
.field input,.field select{
  width:100%;padding:14px 16px;border:none;border-radius:12px;font-size:16px;
  font-family:inherit;color:var(--text-main);background:var(--input-bg);outline:none;
}
.field input:focus{box-shadow:0 0 0 2px var(--sber-green);}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.toast-wrap{position:fixed;top:16px;right:16px;left:16px;z-index:400;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
.toast{background:var(--text-main);color:var(--card-bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;animation:fadeIn .3s;}

dialog.modal-dialog {
  padding: 24px; border: none; border-radius: 24px; background: var(--card-bg); color: var(--text-main);
  width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); margin: auto;
}
dialog::backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h3 { margin: 0; font-size: 20px; font-weight: 700; }
.close-btn { background: var(--input-bg); border: none; color: var(--text-main); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

.treasury-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
.treasury{width:100%; max-width: 500px; color: #fff; border-radius: 24px; padding: 24px; display:flex; flex-direction:column; align-items:flex-start; background: var(--sber-green); animation: popIn 0.4s ease both;}
.treasury .label{font-size:14px; opacity:.9;}
.treasury .amount{font-size:36px; font-weight:700; margin:8px 0;}
.treasury .sub{font-size:13px; opacity:.8;}

.members-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:12px;}
.member-circle{background:var(--card-bg); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; align-items:flex-start; box-shadow:var(--shadow); cursor:pointer;}
.member-circle .ava{width:48px;height:48px;border-radius:50%;margin-bottom:12px;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;}
.member-circle .ava img{width:100%;height:100%;object-fit:cover;}
.member-circle .mname{font-size:15px; font-weight:600; margin-bottom:4px;}
.member-circle .mcontrib{font-size:13px; color:var(--text-muted); margin-bottom:8px;}
.member-circle .mdebt{font-size:12px; color:var(--red); font-weight:600; background:var(--red-bg); padding:4px 8px; border-radius:8px;}
.member-circle .mdebt.none{color:var(--sber-green); background:var(--sber-green-bg);}

.table-wrap{overflow-x:auto; border-radius:var(--radius); background:var(--card-bg); box-shadow:var(--shadow);}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;}
table.tbl th,table.tbl td{padding:16px;text-align:left;border-bottom:1px solid var(--border);}
table.tbl th{color:var(--text-muted);font-size:12px;text-transform:uppercase;}
.amt-in{color:var(--sber-green);font-weight:600;}
.amt-out{color:var(--text-main);font-weight:600;}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;}
.badge.green{background:var(--sber-green-bg);color:var(--sber-green);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.blue{background:#eef2ff;color:#4f46e5;}

.auth-layout { min-height: 100vh; width: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.auth-box { background: var(--card-bg); border-radius: 32px; padding: 40px 32px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; animation: popIn 0.4s ease both; }
.auth-brand { text-align: center; margin-bottom: 32px; }
.auth-brand .logo { font-size: 28px; font-weight: 800; color: var(--sber-green); margin-bottom: 8px; }
.auth-tabs { display: flex; background: var(--input-bg); border-radius: 16px; padding: 4px; margin-bottom: 24px; }
.auth-tabs button { flex: 1; border: none; background: transparent; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
.auth-tabs button.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,.05); }

#pinScreen { position: fixed; inset: 0; z-index: 999; background: var(--sber-green); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding: 24px; }
.pin-content { width: 100%; max-width: 360px; display: flex; flex-direction: column; }
.pin-top { margin-bottom: 40px; text-align: center; }
.pin-top .ava-small { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px; color: #0b2e16; margin: 0 auto 16px; overflow: hidden; }
.pin-top .ava-small img { width: 100%; height: 100%; object-fit: cover; }
.pin-dots { display: flex; justify-content: center; gap: 12px; }
.pin-dots .dot { width: 48px; height: 56px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
.pin-dots .dot::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity 0.2s; }
.pin-dots .dot.filled::after { opacity: 1; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pin-pad button { height: 64px; border: none; border-radius: 16px; background: #fff; color: #000; font-size: 24px; font-weight: 500; cursor: pointer; }
.pin-pad button.fn { background: transparent; color: #fff; font-size: 14px; font-weight: 500; }

.avatar-edit{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.avatar-preview{width:80px;height:80px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;font-weight:600;}
.avatar-preview img{width:100%;height:100%;object-fit:cover;}
.theme-toggle { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card-bg); border-radius: var(--radius); margin-bottom: 16px; }
.switch { position: relative; display: inline-block; width: 50px; height: 28px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--input-bg); transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--sber-green); }
input:checked + .slider:before { transform: translateX(22px); }

.bank-card{width: 100%; max-width: 420px; aspect-ratio: 1.586 / 1; border-radius: 20px; background: #000; color: #fff; padding: 24px; display: flex; gap: 20px; position: relative; overflow: hidden;}
.bank-card .qr-side{width: 36%; background: #fff; border-radius: 12px; padding: 8px; display: flex; align-items: center; justify-content: center;}
.bank-card .qr-side canvas{width:100%;height:auto;}
.bank-card .data-side{flex:1;display:flex;flex-direction:column;justify-content:center;}
.bank-card .card-num{font-family:monospace;font-size:16px;letter-spacing:2px;font-weight:600;margin:8px 0;color:var(--sber-green);}
.bank-card.blocked{filter:grayscale(1) brightness(.8);}

footer.disclaimer{text-align:center;padding:24px 16px;font-size:12px;color:var(--text-muted);margin-top:auto;}
.bottom-nav {position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--card-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 100;}
.bottom-nav a {display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 500; cursor: pointer;}
.bottom-nav a.active { color: var(--sber-green); }
.bottom-nav a svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }
.bottom-nav .logout-btn { color: var(--red); }

@media (min-width: 900px) {
  body { padding-bottom: 0; padding-left: 260px; }
  header.topbar { display: none; }
  .bottom-nav { display: none; }
  .drawer {display: flex; position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: var(--bg); flex-direction: column; padding: 24px 16px; border-right: 1px solid var(--border); z-index: 100;}
  .drawer-head { padding: 0 12px 24px; margin-bottom: 16px;}
  .drawer-head .brand { font-size: 16px; font-weight: 700; }
  .drawer nav { flex: 1; }
  .drawer nav a {display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: var(--text-main); font-weight: 500; font-size: 15px; margin-bottom: 4px; cursor: pointer;}
  .drawer nav a.active { background: var(--card-bg); color: var(--sber-green); font-weight: 600; box-shadow: var(--shadow); }
  .drawer-foot { border-top: 1px solid var(--border); padding-top: 16px; }
  .drawer-foot a { color: var(--red); display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-weight: 500; cursor: pointer;}
  main.page { padding: 32px; max-width: 1000px; margin: 0 auto; }
}

#loadingScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000;}
.loading-landscape{position:absolute;inset:0;background-size:cover;background-position:center;}
.loading-landscape::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
.loading-greeting{position:absolute;top:40px;left:40px;font-size:28px;font-weight:700;color:#fff;z-index:2;}
.loading-ring-wrap{position:relative;width:120px;height:120px;z-index:2;}
.loading-ring{width:100%;height:100%;transform:rotate(-90deg);}
.loading-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:6;}
.loading-ring .ring-fg{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .25s linear;}
.loading-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;}
</style>

const SHA256 = (function(){
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  function rotr(x,n){return (x>>>n)|(x<<(32-n))}
  function utf8Bytes(str){const out=[];for(let i=0;i<str.length;i++){let c=str.charCodeAt(i);if(c<0x80)out.push(c);else if(c<0x800){out.push(0xC0|(c>>6),0x80|(c&0x3F))}else if(c<0xD800||c>=0xE000){out.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F))}else{i++;c=0x10000+(((c&0x3FF)<<10)|(str.charCodeAt(i)&0x3FF));out.push(0xF0|(c>>18),0x80|((c>>12)&0x3F),0x80|((c>>6)&0x3F),0x80|(c&0x3F))}}return out;}
  return function(msg){
    const bytes=utf8Bytes(msg);const bitLen=bytes.length*8;bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
    const lenHi=Math.floor(bitLen/0x100000000);const lenLo=bitLen>>>0;bytes.push((lenHi>>>24)&0xFF,(lenHi>>>16)&0xFF,(lenHi>>>8)&0xFF,lenHi&0xFF);bytes.push((lenLo>>>24)&0xFF,(lenLo>>>16)&0xFF,(lenLo>>>8)&0xFF,lenLo&0xFF);

      for(let i=16;i<64;i++){const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;

function makeHash(secret){const salt=uid()+uid();return{salt,hash:SHA256(salt+'::'+secret)}}
function verifyHash(secret,salt,hash){return SHA256(salt+'::'+secret)===hash}

function getTreasuryBalance(){
  let bal=0;
  for(const id in OPS){
    const op = OPS[id];
    if(op.type==='contribute')bal+=op.amount; else if(op.type==='loan_out')bal-=op.amount; else if(op.type==='loan_return')bal+=op.amount; else if(op.type==='personal_to_treasury')bal+=op.amount; else if(op.type==='admin_treasury_out')bal-=op.amount;
  }
  return Math.max(0,bal);
}
function getUserContributed(userId){
  let s=0;
  for(const id in OPS){ const op=OPS[id]; if(op.userId===userId && (op.type==='contribute'||op.type==='personal_to_treasury')) s+=op.amount; }
  return s;
}
function getPersonalBalance(userId){
  let b=0;
  for(const id in OPS){
    const op=OPS[id];
    if(op.type==='personal_deposit' && op.userId===userId) b+=op.amount;
    else if(op.type==='personal_withdraw' && op.userId===userId) b-=op.amount;
    else if(op.type==='personal_to_treasury' && op.userId===userId) b-=op.amount;
    else if(op.type==='transfer_out' && op.userId===userId) b-=op.amount;
    else if(op.type==='transfer_in' && op.targetUserId===userId) b+=op.amount;
  }
  return Math.max(0,b);
}
function getActiveLoan(userId){
  for(const id in LOANS){ if(LOANS[id].userId===userId && LOANS[id].status==='active') return LOANS[id]; }
  return null;
}
function getUserCard(userId){
  for(const id in CARDS){ if(CARDS[id].userId===userId) return CARDS[id]; }
  return null;
}

let activeAlertId = null;
function checkFraudAlerts() {
  const sess = getSession();
  if(!sess || sess.user.role !== 'admin') return;
  
  const pending = Object.values(NOTIFS).find(n => n.status === 'pending');
  if(pending && activeAlertId !== pending.id) {
    activeAlertId = pending.id;
    showFraudModal(pending);
  }
}

function showFraudModal(alert) {
  closeModal(); // Закрываем всё, что открыто, чтобы показать алерт
  showModal('⚠️ Безопасность', `
    <div data-alert-id="${alert.id}">
      <p>Кто-то несколько раз пытается войти в аккаунт <b>${esc(alert.targetUserName)}</b>.</p>
      <p class="text-muted" style="font-size:13px;">Если вы считаете, что это совершает постороннее лицо, нажмите «Заблокировать». Если это были вы — нажмите «Разблокировать».</p>
      <div class="btn-row" style="flex-direction:column;">
        <button class="btn red block" onclick="resolveAlert('${alert.id}', '${alert.targetUserId}', 'block')">Заблокировать действие</button>
        <button class="btn green block" onclick="resolveAlert('${alert.id}', '${alert.targetUserId}', 'unblock')">Разблокировать действие</button>
      </div>
    </div>
  `);
}

window.resolveAlert = async (alertId, userId, action) => {
  closeModal();
  activeAlertId = null;
  
  if (action === 'block') {
    await db.ref('users/' + userId).update({ blocked: true });
    await db.ref('notifications/' + alertId).update({ status: 'resolved_blocked' });
    toast('Пользователь заблокирован.', 'ok');
  } else {
    const user = USERS[userId];
    const currentPenalty = user.penaltyLevel || 0;
    const newPenalty = currentPenalty + 1;
    
    if (newPenalty >= 3) {
      await db.ref('users/' + userId).update({ blocked: true, penaltyLevel: 0 });
      toast('Пользователь заблокирован на 48 часов (3-е нарушение).', 'err');
    } else {
      const newLimit = newPenalty === 1 ? 6 : 3; 
      await db.ref('users/' + userId).update({ penaltyLevel: newPenalty, maxPinAttempts: newLimit });
      toast('Лимит попыток снижен. Теперь максимум: ' + newLimit, 'ok');
    }
    await db.ref('notifications/' + alertId).update({ status: 'resolved_unblocked' });
  }
  
  ssSet(SS.pinFail, 0);
  ssSet('upf_pin_lock_level', 0);
  ssSet('upf_pin_lock_until', 0);
  route();
};

function parseHash(){ const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); return {path:path||(getSession()?'index':'login'), params: new URLSearchParams(qs||'')}; }
function navigate(path,params){ let h='#/'+path; if(params){ const q=new URLSearchParams(params).toString(); if(q)h+='?'+q; } if(location.hash===h)route(); else location.hash=h; }

async function route(){
  if(!DATA_READY) return;
  const {path,params}=parseHash();
  const sess = getSession();
  
  if(!sess && path !== 'login') { location.replace('#/login'); return; }
  if(sess && path === 'login') { location.replace('#/index'); return; }
  if(sess && sess.user.blocked) { clearSession(); location.replace('#/login?reason=blocked'); return; }
  
  closeAllModals();
  await routes[path]();
}

window.instantAction = async (type, payload) => {
  const me = getSession().user; const ts = nowISO();
  
  if(type === 'transfer') {
    const amt = Number(payload.amount);
    if(getPersonalBalance(me.id) < amt) { toast('Недостаточно средств', 'err'); return; }
    const target = USERS[payload.targetUserId];
    const updates = {}; const outId = uid(), inId = uid();
    updates['operations/'+outId] = { id: outId, userId: me.id, userName: me.fio, type: 'transfer_out', amount: amt, targetUserId: target.id, ts, comment: 'Перевод для '+target.fio };
    updates['operations/'+inId] = { id: inId, userId: target.id, userName: target.fio, type: 'transfer_in', amount: amt, targetUserId: me.id, ts, comment: 'Перевод от '+me.fio };
    await db.ref().update(updates);
    toast('Перевод выполнен', 'ok');
  } else if(type === 'deposit') {
    const id = uid();
    await db.ref('operations/'+id).set({ id, userId: me.id, userName: me.fio, type: 'personal_deposit', amount: Number(payload.amount), ts });
    toast('Пополнено', 'ok');
  } else if(type === 'withdraw') {
    if(getPersonalBalance(me.id) < payload.amount) { toast('Недостаточно средств', 'err'); return; }
    const id = uid();
    await db.ref('operations/'+id).set({ id, userId: me.id, userName: me.fio, type: 'personal_withdraw', amount: Number(payload.amount), ts });
    toast('Снято', 'ok');
  }
};

window.showWithdraw = () => { showModal('Снять', `<div class="field"><input type="number" id="inpAmt" placeholder="Сумма"></div><button class="btn block" onclick="doAction('withdraw')">Снять</button>`); };
window.showTransfer = () => { 
  const me = getSession().user; let opts = Object.values(USERS).filter(u => u.id !== me.id).map(u => `<option value="${u.id}">${u.fio}</option>`).join('');
  showModal('Перевод', `<div class="field"><select id="inpUser">${opts}</select></div><div class="field"><input type="number" id="inpAmt" placeholder="Сумма"></div><button class="btn block" onclick="doTransfer()">Перевести</button>`); 
};
window.doAction = async (type) => {
  const amt = Number(document.getElementById('inpAmt').value); if(!amt || amt <= 0) return;
  closeModal(); await instantAction(type, { amount: amt });
  if(location.hash.includes('personal')) renderPersonal(); if(location.hash.includes('index')) renderIndex();
};
window.doTransfer = async () => {
  const targetId = document.getElementById('inpUser').value; const amt = Number(document.getElementById('inpAmt').value); if(!amt || !targetId) return;
  closeModal(); await instantAction('transfer', { amount: amt, targetUserId: targetId });
  if(location.hash.includes('personal')) renderPersonal(); if(location.hash.includes('index')) renderIndex();
};

/* ============================================================
   КАРТА И АККАУНТ
   ============================================================ */
async function renderCard(){
  const sess = getSession(); if(!sess) return; const me = sess.user; const card = getUserCard(me.id);
  let cardHtml = card ? `<div class="bank-card ${card.status==='blocked'?'blocked':''}"><div class="qr-side" id="qrSide"></div><div class="data-side"><div style="font-size:10px;opacity:.7;">УДОСТОВЕРЕНИЕ</div><div style="font-size:14px;font-weight:600;margin:2px 0 12px;">УПФ</div><div class="card-fio">${me.fio}</div><div class="card-num">${card.number.slice(0,4)} ${card.number.slice(4,8)} ${card.number.slice(8)}</div><div style="font-size:12px;">Код: <b>${card.code}</b></div></div></div>` : `<div class="card center"><p>Карты нет.</p><button class="btn" onclick="db.ref('cards/'+uid()).set({id:uid(),userId:'${me.id}',number:randomDigits(10),code:randomDigits(3),status:'active'})">Оформить</button></div>`;
  document.getElementById('app').innerHTML = shell('card', `<h2 class="page-title">Карта</h2>${cardHtml}`);
  bindShell(); startIdle();
}

async function renderAccount(){
  const sess = getSession(); if(!sess) return; const me = sess.user;
  const savedTheme = localStorage.getItem('upf_theme') || 'light'; document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('app').innerHTML = shell('account', `
    <h2 class="page-title">Аккаунт</h2>
    <div class="theme-toggle"><span>Тёмная тема</span><label class="switch"><input type="checkbox" id="themeToggle" ${savedTheme === 'dark' ? 'checked' : ''}><span class="slider"></span></label></div>
    <div class="card"><h3>${me.fio}</h3><p class="text-muted">${me.email}</p></div>
  `);
  bindShell(); startIdle();
  const toggle = document.getElementById('themeToggle');
  if(toggle) toggle.addEventListener('change', (e) => { const theme = e.target.checked ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('upf_theme', theme); });
}
