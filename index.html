<style>
:root {
  --sber-green: #21A038;
  --sber-green-bg: #e5f5e9;
  --bg: #f2f3f5;
  --card-bg: #ffffff;
  --text-main: #1a1a1a;
  --text-muted: #7a7a7a;
  --border: #e5e6e8;
  --input-bg: #f2f3f5;
  --shadow: 0 4px 20px rgba(0,0,0,0.04);
  --red: #ff3b30;
  --red-bg: #fff5f5;
  --radius: 20px;
}
[data-theme="dark"] {
  --bg: #0f0f11;
  --card-bg: #1c1c1e;
  --text-main: #ffffff;
  --text-muted: #8e8e93;
  --border: #2c2c2e;
  --input-bg: #2c2c2e;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --sber-green-bg: #1c3b24;
  --red-bg: #3b1c1c;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes slideRight { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;font-family:'Inter', sans-serif;background:var(--bg);color:var(--text-main);-webkit-font-smoothing:antialiased;min-height:100%;transition: background .3s;}
body{display:flex;flex-direction:column;min-height:100vh; padding-bottom: 70px;}

header.topbar { background: var(--card-bg); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border); height: 60px; box-sizing: border-box; }
header.topbar h1{font-size:16px;margin:0;font-weight:600;}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-left:auto;}

main.page{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:16px; animation: fadeIn 0.3s ease both;}
h2.page-title{font-size:24px;margin:8px 0 16px;font-weight:700;}

.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:none; animation: fadeIn 0.4s ease both;}
.card+.card{margin-top:12px;}
.section-title{font-size:18px;margin:24px 0 12px;font-weight:600;}

.btn{ display:inline-flex;align-items:center;justify-content:center; padding:14px 24px;border:none;border-radius:12px;font-size:15px;font-weight:600; cursor:pointer;color:#fff; font-family:inherit; transition:transform .1s, opacity .2s; background: var(--sber-green); }
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.ghost{background:var(--input-bg);color:var(--text-main);}
.btn.neutral{background:var(--input-bg);color:var(--text-main);border:none;}
.btn.red{background:var(--red);}
.btn.small{padding:8px 14px;font-size:13px;border-radius:8px;}
.btn.block{width:100%;}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;font-weight:500;}
.field input,.field select{ width:100%;padding:14px 16px;border:none;border-radius:12px;font-size:16px; font-family:inherit;color:var(--text-main);background:var(--input-bg);outline:none; }
.field input:focus{box-shadow:0 0 0 2px var(--sber-green);}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.toast-wrap{position:fixed;top:16px;right:16px;left:16px;z-index:400;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
.toast{background:var(--text-main);color:var(--card-bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;animation:fadeIn .3s;}

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 999; }
.modal-overlay.open { display: flex; }
.modal-content { background: var(--card-bg); border-radius: 24px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: popIn 0.3s ease; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h3 { margin: 0; font-size: 20px; font-weight: 700; }
.close-btn { background: var(--input-bg); border: none; color: var(--text-main); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

.treasury-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
.treasury{width:100%; max-width: 500px; color: #fff; border-radius: 24px; padding: 24px; display:flex; flex-direction:column; align-items:flex-start; background: var(--sber-green); animation: popIn 0.4s ease both;}
.treasury .label{font-size:14px; opacity:.9;}
.treasury .amount{font-size:36px; font-weight:700; margin:8px 0;}
.treasury .sub{font-size:13px; opacity:.8;}

.members-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:12px;}
.member-circle{background:var(--card-bg); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; align-items:flex-start; box-shadow:var(--shadow); cursor:pointer; overflow:hidden;}
.member-circle .ava{width:48px;height:48px;border-radius:50%;margin-bottom:12px;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;}
.member-circle .ava img{width:100%;height:100%;object-fit:cover;}
.member-circle .mname{font-size:15px; font-weight:600; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;}
.member-circle .mcontrib{font-size:13px; color:var(--text-muted); margin-bottom:8px;}
.member-circle .mdebt{font-size:12px; color:var(--red); font-weight:600; background:var(--red-bg); padding:4px 8px; border-radius:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.member-circle .mdebt.none{color:var(--sber-green); background:var(--sber-green-bg);}

.table-wrap{overflow-x:auto; border-radius:var(--radius); background:var(--card-bg); box-shadow:var(--shadow);}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;}
table.tbl th,table.tbl td{padding:16px;text-align:left;border-bottom:1px solid var(--border);}
table.tbl th{color:var(--text-muted);font-size:12px;text-transform:uppercase;}
.amt-in{color:var(--sber-green);font-weight:600;}
.amt-out{color:var(--text-main);font-weight:600;}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;}
.badge.green{background:var(--sber-green-bg);color:var(--sber-green);}
.badge.red{background:var(--red-bg);color:var(--red);}

.auth-layout { min-height: 100vh; width: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.auth-box { background: var(--card-bg); border-radius: 32px; padding: 40px 32px; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); display: flex; flex-direction: column; animation: popIn 0.4s ease both; margin: auto; }
.auth-brand { text-align: center; margin-bottom: 32px; }
.auth-brand .logo { font-size: 28px; font-weight: 800; color: var(--sber-green); margin-bottom: 8px; }
.auth-tabs { display: flex; background: var(--input-bg); border-radius: 16px; padding: 4px; margin-bottom: 24px; }
.auth-tabs button { flex: 1; border: none; background: transparent; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
.auth-tabs button.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,.05); }

#pinScreen { position: fixed; inset: 0; z-index: 999; background: var(--sber-green); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding: 24px; animation: fadeIn 0.4s ease both; }
.pin-content { width: 100%; max-width: 360px; display: flex; flex-direction: column; }
.pin-top { margin-bottom: 30px; text-align: center; }
.pin-top .ava-small { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px; color: #0b2e16; margin: 0 auto 16px; overflow: hidden; }
.pin-top .ava-small img { width: 100%; height: 100%; object-fit: cover; }
.pin-top .uname { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.pin-top .uhint { font-size: 14px; opacity: 0.8; margin-bottom: 20px; }
.pin-dots { display: flex; justify-content: center; gap: 12px; }
.pin-dots .dot { width: 48px; height: 56px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
.pin-dots .dot::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity 0.2s; }
.pin-dots .dot.filled::after { opacity: 1; }
.pin-dots.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pin-pad button { height: 64px; border: none; border-radius: 16px; background: rgba(255,255,255,0.7); backdrop-filter: blur(5px); color: #000; font-size: 24px; font-weight: 600; cursor: pointer; transition: transform 0.1s, background 0.2s; }
.pin-pad button:active { transform: scale(0.9); background: rgba(255,255,255,1); }
.pin-pad button.fn { background: transparent; color: #fff; font-size: 14px; font-weight: 500; }
.pin-pad button.fn:active { background: rgba(255,255,255,0.2); transform: scale(0.9); }

.avatar-edit{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.avatar-preview{width:80px;height:80px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;font-weight:600;}
.avatar-preview img{width:100%;height:100%;object-fit:cover;}
.theme-toggle { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card-bg); border-radius: var(--radius); margin-bottom: 16px; }
.switch { position: relative; display: inline-block; width: 50px; height: 28px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--input-bg); transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--sber-green); }
input:checked + .slider:before { transform: translateX(22px); }

.bank-card { width: 100%; max-width: 420px; aspect-ratio: 1.586 / 1; border-radius: 20px; background: #000; color: #fff; padding: 24px; display: flex; gap: 20px; position: relative; overflow: hidden; animation: popIn 0.4s ease both;}
.bank-card::before { content:''; position:absolute; top:-50%; right:-20%; width:70%; height:150%; background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%); }
.bank-card .qr-side { width: 36%; background: #fff; border-radius: 12px; padding: 8px; display: flex; align-items: center; justify-content: center; align-self: center; }
.bank-card .qr-side img, .bank-card .qr-side canvas { width: 100%; height: auto; image-rendering: pixelated; }
.bank-card .data-side { flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0; z-index:1; }
.bank-card .card-num { font-family: monospace; font-size:16px; letter-spacing:2px; font-weight:600; margin:8px 0; color:var(--sber-green); }
.bank-card .card-fio { font-size:15px; font-weight:600; line-height:1.2; margin-bottom:12px; word-break:break-word; }
.bank-card.blocked { filter: grayscale(1) brightness(.8); }

footer.disclaimer{text-align:center;padding:24px 16px;font-size:12px;color:var(--text-muted);margin-top:auto;}
.bottom-nav {position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--card-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 100;}
.bottom-nav a {display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 500; cursor: pointer; text-decoration: none;}
.bottom-nav a.active { color: var(--sber-green); }
.bottom-nav a svg { width: 24px; height: 24px; max-width: 24px; max-height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.bottom-nav .logout-btn { color: var(--red); }

.drawer { display: none !important; }
.drawer-overlay { display: none !important; }

@media (min-width: 900px) {
  body { padding-bottom: 0; padding-left: 260px; }
  header.topbar { display: none; }
  .bottom-nav { display: none; }
  .drawer {display: flex !important; position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: var(--bg); flex-direction: column; padding: 24px 16px; border-right: 1px solid var(--border); z-index: 100;}
  .drawer-head { padding: 0 12px 24px; margin-bottom: 16px;}
  .drawer-head .brand { font-size: 16px; font-weight: 700; }
  .drawer nav { flex: 1; }
  .drawer nav a {display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: var(--text-main); font-weight: 500; font-size: 15px; margin-bottom: 4px; cursor: pointer; text-decoration: none;}
  .drawer nav a.active { background: var(--card-bg); color: var(--sber-green); font-weight: 600; box-shadow: var(--shadow); }
  .drawer nav a svg { width: 22px; height: 22px; max-width: 22px; max-height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .drawer-foot { border-top: 1px solid var(--border); padding-top: 16px; }
  .drawer-foot a { color: var(--red); display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-weight: 500; cursor: pointer; text-decoration: none;}
  .drawer-foot a svg { width: 22px; height: 22px; max-width: 22px; max-height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  main.page { padding: 32px; max-width: 1000px; margin: 0 auto; }
}

#loadingScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000;}
.loading-landscape{position:absolute;inset:0;background-size:cover;background-position:center;animation: fadeIn 0.5s ease;}
.loading-landscape::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
.loading-greeting{position:absolute;top:40px;left:40px;font-size:28px;font-weight:700;color:#fff;z-index:2; animation: slideRight 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;}
.loading-ring-wrap{position:relative;width:120px;height:120px;z-index:2; animation: popIn 0.5s ease both;}
.loading-ring{width:100%;height:100%;transform:rotate(-90deg);}
.loading-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:6;}

.loading-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;}
</style>

    for(let off=0;off<bytes.length;off+=64){
      for(let i=0;i<16;i++)w[i]=(bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
      for(let i=16;i<64;i++){const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for(let i=0;i<64;i++){const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[i]+w[i])>>>0;const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
      h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;
    }
    return [h0,h1,h2,h3,h4,h5,h6,h7].map(x=>x.toString(16).padStart(8,'0')).join('');
  };
})();
function makeHash(secret){const salt=uid()+uid();return{salt,hash:SHA256(salt+'::'+secret)}}
function verifyHash(secret,salt,hash){return SHA256(salt+'::'+secret)===hash}

const ssGet=(k,d)=>{try{const r=sessionStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}};
const ssSet=(k,v)=>sessionStorage.setItem(k,JSON.stringify(v));
const ssDel=k=>sessionStorage.removeItem(k);

function getSession(){
  const s = ssGet(SS.session, null);
  if(!s || !s.userId) return null;
  const u = USERS[s.userId];
  if(!u || u.blocked) return null;
  return { ...s, user: u };
}

  ssSet(SS.session,{userId,loginAt:nowISO()}); 
  localStorage.setItem('upf_remembered', userId); 
}
function clearSession(){ ssDel(SS.session); }

const routes = { login: renderLogin, index: renderIndex, personal: renderPersonal, card: renderCard, account: renderAccount, admin: renderAdminPanel };
function parseHash(){ const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); return {path:path||(getSession()?'index':'login'), params: new URLSearchParams(qs||'')}; }
function navigate(path,params){ let h='#/'+path; if(params){ const q=new URLSearchParams(params).toString(); if(q)h+='?'+q; } if(location.hash===h)route(); else location.hash=h; }

async function route(){
  if(!DATA_READY) return;
  const {path,params}=parseHash();
  const sess = getSession();
  
  if(!sess && path !== 'login') { location.replace('#/login'); return; }
  if(sess && path === 'login') { location.replace('#/index'); return; }
  if(sess && sess.user.blocked) { clearSession(); location.replace('#/login?reason=blocked'); return; }
  
  closeAllModals();
  await routes[path](params);
}
window.addEventListener('hashchange', route);

async function renderLogin(params){
  const rememberedId = localStorage.getItem('upf_remembered');
  const reason = params ? params.get('reason') : null;

  if (CONFIG.loginDisabled) {
    document.getElementById('app').innerHTML = `

        </div>
      </div>`;
    return;
  }

  if (rememberedId && !reason) {
    const user = USERS[rememberedId];
    if (user) {
      document.getElementById('app').innerHTML = `
      <div id="pinScreen">
        <div class="pin-content">
          <div class="pin-top">
            <div class="ava-small">${user.avatar ? `<img src="${user.avatar}" alt="">` : initials(user.fio)}</div>
            <div class="uname">${esc(user.name)} ${esc(user.lastname)}</div>

              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              <span class="dot"></span><span class="dot"></span>
            </div>
          </div>
          <div id="pinLocked" style="display:none; color:#fff; text-align:center; padding:16px; background:rgba(255,0,0,0.3); border-radius:12px; margin-bottom:20px;">
            <div id="pinLockText">Вход заблокирован.</div>
            <button class="btn ghost small" style="margin-top:10px; color:#fff; border-color:#fff;" onclick="localStorage.removeItem('upf_remembered'); window.location.reload();">Войти по email и паролю</button>
          </div>
          <div class="pin-pad" id="pinPad">
            <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
            <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
            <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
            <button class="fn" data-k="switch">Другой</button>
            <button data-k="0">0</button>
            <button class="fn" data-k="del">⌫</button>
          </div>
        </div>
      </div>`;
      let pinAttempts = 0, pinBuf = '';
      document.getElementById('pinPad').addEventListener('click', async e => {
        const b = e.target.closest('button'); if(!b) return;
        const k = b.dataset.k;
        if(k === 'switch') { localStorage.removeItem('upf_remembered'); window.location.reload(); return; }
        if(k === 'del') { pinBuf = pinBuf.slice(0,-1); updateDots(); return; }
        if(pinAttempts >= 3) return;
        if(pinBuf.length >= 5) return;
        pinBuf += k; updateDots();
        if(pinBuf.length === 5) {
          if(verifyHash(pinBuf, user.pin.salt, user.pin.hash)) {
            setSession(user.id);
            await showLoadingScreen(user.name || user.fio.split(' ')[0]);
            navigate('index');
          } else {
            const dotsContainer = document.getElementById('pinDots');
            dotsContainer.classList.add('shake');
            setTimeout(() => dotsContainer.classList.remove('shake'), 400);

            pinAttempts++; pinBuf = ''; updateDots();
            if(pinAttempts >= 3) {
              document.getElementById('pinLocked').style.display = 'block';
              document.getElementById('pinPad').style.display = 'none';
            } else { toast('Неверный PIN-код', 'err'); }
          }
        }
      });
      function updateDots(){ document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('filled', i<pinBuf.length)); }
      return;
    }
  }

  document.getElementById('app').innerHTML=`
  <div class="auth-layout">
    <div class="auth-box">
      <div class="auth-brand">
        <div class="logo">УПФ</div>

        <div class="field"><label>Пароль</label><input type="password" id="loginPass" style="background:#e8f0fe;color:#000;"></div>
        <div id="loginMsg" style="color:var(--red);font-size:13px;margin-bottom:10px;"></div>

      <form id="regForm" style="display:none" novalidate>
        <div class="row-2">
          <div class="field"><label>Фамилия</label><input type="text" id="regLastname"></div>

        <div class="field"><label>Пароль</label><input type="password" id="regPass"></div>
        <div class="field"><label>PIN (5 цифр)</label><input type="password" id="regPin" maxlength="5"></div>
        <div id="regMsg" style="color:var(--red);font-size:13px;margin-bottom:10px;"></div>
        <button class="btn block" type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>`;

  document.getElementById('authTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#authTabs button').forEach(x => x.classList.toggle('active', x === b));
    document.getElementById('loginForm').style.display = b.dataset.tab === 'login' ? 'block' : 'none';
    document.getElementById('regForm').style.display = b.dataset.tab === 'register' ? 'block' : 'none';
  });

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass = document.getElementById('loginPass').value;
    const user = Object.values(USERS).find(u => u.email === email);
    if(!user) { document.getElementById('loginMsg').textContent = 'Пользователь не найден'; return; }
    if(!verifyHash(pass, user.pass.salt, user.pass.hash)) { document.getElementById('loginMsg').textContent = 'Неверный пароль'; return; }
    if(user.blocked) { document.getElementById('loginMsg').textContent = 'Аккаунт заблокирован'; return; }
    
    setSession(user.id);
    await showLoadingScreen(user.name || user.fio.split(' ')[0]);
    navigate('index');
  });

  document.getElementById('regForm').addEventListener('submit', async e => {
    e.preventDefault();
    const lastname = document.getElementById('regLastname').value.trim();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pass = document.getElementById('regPass').value;
    const pin = document.getElementById('regPin').value;
    if(!lastname || !name || !email || !pass || !pin) return;
    if(Object.values(USERS).some(u => u.email === email)) { document.getElementById('regMsg').textContent = 'Email занят'; return; }

    const newUser = { id: uid(), lastname, name, fio: `${lastname} ${name}`, email, pass: makeHash(pass), pin: makeHash(pin), role: 'member', status: 'active', createdAt: nowISO() };
    await db.ref('users/' + newUser.id).set(newUser);

    document.getElementById('regMsg').textContent = 'Успешно! Войдите.';
    setTimeout(() => { document.querySelector('#authTabs button[data-tab="login"]').click(); }, 1000);
  });
}

function getTreasuryBalance(){
  let bal=0;
  for(const id in OPS){
    const op = OPS[id];
    if(op.type==='contribute')bal+=op.amount; else if(op.type==='loan_out')bal-=op.amount; else if(op.type==='loan_return')bal+=op.amount; else if(op.type==='personal_to_treasury')bal+=op.amount; else if(op.type==='admin_treasury_out')bal-=op.amount;
  }
  return Math.max(0,bal);
}
function getUserContributed(userId){
  let s=0;
  for(const id in OPS){ const op=OPS[id]; if(op.userId===userId && (op.type==='contribute'||op.type==='personal_to_treasury')) s+=op.amount; }
  return s;
}
function getPersonalBalance(userId){
  let b=0;
  for(const id in OPS){
    const op=OPS[id];
    if(op.type==='personal_deposit' && op.userId===userId) b+=op.amount;
    else if(op.type==='personal_withdraw' && op.userId===userId) b-=op.amount;
    else if(op.type==='personal_to_treasury' && op.userId===userId) b-=op.amount;
    else if(op.type==='transfer_out' && op.userId===userId) b-=op.amount;
    else if(op.type==='transfer_in' && op.targetUserId===userId) b+=op.amount;
  }
  return Math.max(0,b);
}
function getActiveLoan(userId){
  for(const id in LOANS){ if(LOANS[id].userId===userId && LOANS[id].status==='active') return LOANS[id]; }
  return null;
}
function getUserCard(userId){
  for(const id in CARDS){ if(CARDS[id].userId===userId) return CARDS[id]; }
  return null;
}

function checkNewMessages() {
  const sess = getSession();
  if (!sess) return;
  const me = sess.user;
  const seenIds = JSON.parse(localStorage.getItem('seen_messages') || '[]');
  
  for (const id in MESSAGES) {
    const msg = MESSAGES[id];
    if ((msg.target === 'all' || msg.target === me.id) && !seenIds.includes(id)) {
      showModal('Сообщение от администратора', `
        <p style="font-size:16px; line-height:1.5;">${esc(msg.text)}</p>
        <div style="font-size:12px; color:var(--text-muted); margin-top:20px;">${fmtDateTime(msg.ts)}</div>
        <button class="btn block" style="margin-top:20px;" onclick="closeModal(); markMessageSeen('${id}')">Понятно</button>
      `);
      break; 
    }
  }
}

window.markMessageSeen = (id) => {
  const seenIds = JSON.parse(localStorage.getItem('seen_messages') || '[]');
  if (!seenIds.includes(id)) {
    seenIds.push(id);
    localStorage.setItem('seen_messages', JSON.stringify(seenIds));
  }
  closeModal();
};

window.openMember = (userId) => {

window.executeTreasuryAction = async (type) => {
  const me = getSession().user;
  const amtEl = document.getElementById('actionAmount');
  const amt = Number(amtEl ? amtEl.value : 0);
  
  if(!amt || amt <= 0) { toast('Введите корректную сумму', 'err'); return; }
  closeModal(); 
  const id = uid();
  
  if(type === 'deposit') {
    if(CONFIG.depositsDisabled) { toast('Администратор ограничил взносы.', 'err'); return; }
    if(getPersonalBalance(me.id) < amt) { toast('Недостаточно на личном счёте', 'err'); return; }
    await db.ref('operations/'+id).set({ id, userId: me.id, userName: me.fio, type: 'personal_to_treasury', amount: amt, ts: nowISO() });
    toast('Внесено в казну', 'ok');
  } 
  else if(type === 'loan') {
    if(CONFIG.loansDisabled) { toast('Администратор ограничил займы.', 'err'); return; }
    if(getTreasuryBalance() < amt) { toast('В казне нет столько', 'err'); return; }
    const loanId = uid();
    const due = new Date(); due.setDate(due.getDate() + 30);
    const updates = {};
    updates['loans/'+loanId] = { id: loanId, userId: me.id, userName: me.fio, amount: amt, percent: 10, takenAt: nowISO(), dueDate: due.toISOString(), status: 'active' };
    updates['operations/'+id] = { id, userId: me.id, userName: me.fio, type: 'loan_out', amount: amt, ts: nowISO(), comment: 'Выдача займа' };
    const id2 = uid();
    updates['operations/'+id2] = { id: id2, userId: me.id, userName: me.fio, type: 'personal_deposit', amount: amt, ts: nowISO(), comment: 'Зачисление займа' };
    await db.ref().update(updates);
    toast('Заём взят', 'ok');
  } 
  else if(type === 'return') {
    if(CONFIG.returnsDisabled) { toast('Администратор ограничил возврат.', 'err'); return; }
    const loan = getActiveLoan(me.id);
    if(!loan) return;
    if(getPersonalBalance(me.id) < amt) { toast('Недостаточно средств на личном', 'err'); return; }
    
    const totalDebt = loan.amount + Math.round(loan.amount * (loan.percent || 0) / 100);
    let newLoanAmount = loan.amount;
    let isFullyClosed = false;
    
    if (amt >= totalDebt) {
      isFullyClosed = true;
    } else {
      newLoanAmount = loan.amount - amt;
    }
    
    const updates = {};
    const id1 = uid();
    updates['operations/'+id1] = { id: id1, userId: me.id, userName: me.fio, type: 'personal_withdraw', amount: amt, ts: nowISO(), comment: 'Списание на возврат долга' };
    
    const id2 = uid();
    updates['operations/'+id2] = { id: id2, userId: me.id, userName: me.fio, type: 'loan_return', amount: amt, ts: nowISO(), comment: 'Возврат части займа в казну' };
    
    if (isFullyClosed) {
      updates['loans/'+loan.id+'/status'] = 'returned';
    } else {
      updates['loans/'+loan.id+'/amount'] = newLoanAmount;
    }
    
    await db.ref().update(updates);
    toast('Долг уменьшен на ' + fmtMoney(amt), 'ok');
  }
  
  if(location.hash.includes('index')) renderIndex();
  if(location.hash.includes('personal')) renderPersonal();
};

function drawQRCode(container, text) {
  if(!container) return;
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = 150; canvas.height = 150;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 150, 150);
  
  ctx.fillStyle = '#1a1a1a';
  const size = 15;
  const block = 150 / size;
  
  ctx.fillRect(0, 0, block*3, block*3);
  ctx.fillRect(150 - block*3, 0, block*3, block*3);
  ctx.fillRect(0, 150 - block*3, block*3, block*3);
  
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
  
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if ((r < 3 && c < 3) || (r < 3 && c > size-4) || (r > size-4 && c < 3)) continue;
      if ((hash + r * 31 + c * 17) % 3 === 0) {
        ctx.fillRect(c * block, r * block, block, block);
      }
    }
  }
  
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.objectFit = 'contain';
  container.appendChild(canvas);
}

window.uploadAvatar = async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      canvas.width = 200; canvas.height = 200;
      const ctx = canvas.getContext('2d');
      
      const size = Math.min(img.width, img.height);
      const x = (img.width - size) / 2;
      const y = (img.height - size) / 2;
      
      ctx.drawImage(img, x, y, size, size, 0, 0, 200, 200);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      
      const me = getSession().user;
      await db.ref('users/' + me.id).update({ avatar: dataUrl });
      
      toast('Аватар обновлен', 'ok');
      renderAccount();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};

window.updateAccount = async (type) => {
  const me = getSession().user;
  const updates = {};
  
  if(type === 'fio') {
    const newFio = document.getElementById('accFio').value.trim();
    if (!newFio) return toast('Введите ФИО', 'err');
    updates.fio = newFio;
  } 
  
  else if(type === 'pass') {
    const oldP = document.getElementById('oldPass').value;
    const newP = document.getElementById('accPass').value;
    
    if (!verifyHash(oldP, me.pass.salt, me.pass.hash)) return toast('Неверный старый пароль', 'err');
    if (newP.length < 6) return toast('Новый пароль должен быть не менее 6 символов', 'err');
    
    updates.pass = makeHash(newP);
  } 
  
  else if(type === 'pin') {
    const oldP = document.getElementById('oldPinPass').value;
    const newPin = document.getElementById('accPin').value;
    
    if (!verifyHash(oldP, me.pass.salt, me.pass.hash)) return toast('Неверный пароль', 'err');
    if (!/^\d{5}$/.test(newPin)) return toast('PIN-код должен состоять ровно из 5 цифр', 'err');
    
    updates.pin = makeHash(newPin);
  }
  
  await db.ref('users/' + me.id).update(updates);
  toast('Обновлено!', 'ok');
  
  if(type === 'pass' || type === 'pin') {
    document.getElementById('oldPass').value = '';
    document.getElementById('accPass').value = '';
    document.getElementById('oldPinPass').value = '';
    document.getElementById('accPin').value = '';
  }
};

  const opType = type === 'add' ? 'contribute' : 'admin_treasury_out';
  await db.ref('operations/'+id).set({ id, userId: getSession().user.id, userName: 'Админ', type: opType, amount: amt, ts: nowISO() });
  toast('Казна обновлена', 'ok'); renderAdminPanel();
};

window.adminActionUser = async (type) => {
  const targetId = document.getElementById('admTargetUser').value;
  const amt = Number(document.getElementById('admUserAmount').value);
  const target = USERS[targetId];
  if(!target) return;
  
  if(type === 'personal') {
    if(!amt || amt <= 0) return toast('Введите сумму', 'err');
    const id = uid();
    await db.ref('operations/'+id).set({ id, userId: target.id, userName: target.fio, type: 'personal_deposit', amount: amt, ts: nowISO(), comment: 'От админа' });
    toast('Личный счёт пополнен', 'ok');
  } else if(type === 'debt') {
    if(!amt || amt <= 0) return toast('Введите сумму', 'err');
    const loanId = uid();
    const due = new Date(); due.setDate(due.getDate() + 30);
    const updates = {};
    updates['loans/'+loanId] = { id: loanId, userId: target.id, userName: target.fio, amount: amt, percent: 0, takenAt: nowISO(), dueDate: due.toISOString(), status: 'active', byAdmin: true };
    await db.ref().update(updates);
    toast('Долг введён', 'ok');
  } else if(type === 'cancelDebt') {
    const loan = getActiveLoan(target.id);
    if(!loan) return toast('У пользователя нет активного долга', 'err');
    await db.ref('loans/' + loan.id).update({ status: 'cancelled' });
    toast('Долг аннулирован', 'ok');
  } else if(type === 'block') {
    await db.ref('users/'+target.id).update({ blocked: true });
    toast('Аккаунт заблокирован', 'ok');
  } else if(type === 'unblock') {
    await db.ref('users/'+target.id).update({ blocked: false });
    toast('Аккаунт разблокирован', 'ok');
  }
  renderAdminPanel();
};

window.handleRequest = async (reqId, action) => {
  const req = REQS[reqId];
  if(!req) return;
  
  if(action === 'approve') {
    const opId = uid();
    await db.ref('operations/' + opId).set({ 
      id: opId, userId: req.userId, userName: req.userName, 
      type: 'personal_deposit', amount: req.amount, ts: nowISO(), 
      comment: 'Пополнение (одобрено админом)' 
    });
    await db.ref('requests/' + reqId).remove();
    toast('Заявка одобрена', 'ok');
    renderAdminPanel();
  }
};

window.openRejectModal = (reqId) => {
  showModal('Отклонение заявки', `
    <div class="field">
      <label>Причина</label>
      <select id="rejectReason">
        <option value="Отклонено. Ваших средств нет в кассе отделения.">Отклонено. Ваших средств нет в кассе отделения.</option>
        <option value="Отклонено решением Администратора.">Отклонено решением Администратора.</option>
        <option value="custom">-- Своя причина --</option>
      </select>
    </div>
    <div class="field" id="customReasonBox" style="display:none;">
      <label>Свой текст</label>
      <input type="text" id="customReason">
    </div>
    <button class="btn red block" onclick="confirmReject('${reqId}')">Отклонить</button>
  `);
  
  document.getElementById('rejectReason').addEventListener('change', (e) => {
    document.getElementById('customReasonBox').style.display = e.target.value === 'custom' ? 'block' : 'none';
  });
};

window.confirmReject = async (reqId) => {
  const selectVal = document.getElementById('rejectReason').value;
  const customVal = document.getElementById('customReason').value;
  const reason = selectVal === 'custom' ? (customVal || 'Без причины') : selectVal;
  
  const req = REQS[reqId];
  await db.ref('requests/' + reqId).remove();
  await db.ref('messages/' + uid()).set({
    id: uid(), target: req.userId, text: reason, ts: nowISO(), by: 'Администратор'
  });
  
  closeModal();
  toast('Заявка отклонена', 'ok');
  renderAdminPanel();
};

initFirebaseSync();
if(!location.hash) location.replace('#/login');
window.addEventListener('DOMContentLoaded', route);
route();
</script>
</body>
</html>
