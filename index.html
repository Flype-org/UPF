<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Семейная касса УПФ (УралПромФонд)</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
/* ============================================================
   ПЕРЕМЕННЫЕ И ТЕМЫ
   ============================================================ */
:root {
  --sber-green: #21A038;
  --sber-green-bg: #e5f5e9;
  --bg: #f2f3f5;
  --card-bg: #ffffff;
  --text-main: #1a1a1a;
  --text-muted: #7a7a7a;
  --border: #e5e6e8;
  --input-bg: #f2f3f5;
  --shadow: 0 4px 20px rgba(0,0,0,0.04);
  --red: #ff3b30;
  --red-bg: #fff5f5;
  --radius: 20px;
}
[data-theme="dark"] {
  --bg: #0f0f11;
  --card-bg: #1c1c1e;
  --text-main: #ffffff;
  --text-muted: #8e8e93;
  --border: #2c2c2e;
  --input-bg: #2c2c2e;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --sber-green-bg: #1c3b24;
  --red-bg: #3b1c1c;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; pointer-events: none; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;font-family:'Inter', sans-serif;background:var(--bg);color:var(--text-main);-webkit-font-smoothing:antialiased;min-height:100%;transition: background .3s, color .3s;}
body{display:flex;flex-direction:column;min-height:100vh; padding-bottom: 70px;}
a{color:var(--sber-green);text-decoration:none;}

header.topbar{background: var(--card-bg); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border);}
header.topbar h1{font-size:16px;margin:0;font-weight:600;}
@media (min-width: 900px) { header.topbar { display: none; } }
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-left:auto;}
.user-chip img{width:32px;height:32px;border-radius:50%;object-fit:cover;}

.drawer{display: none;}
.drawer-overlay{display:none;}

main.page{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:16px; animation: slideUp 0.3s ease both;}
h2.page-title{font-size:24px;margin:8px 0 16px;font-weight:700;}

.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:none; animation: fadeIn 0.4s ease both;}
.card+.card{margin-top:12px;}
.section-title{font-size:18px;margin:24px 0 12px;font-weight:600;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 24px;border:none;border-radius:12px;font-size:15px;font-weight:600;
  cursor:pointer;color:#fff; font-family:inherit; transition:transform .1s, opacity .2s, box-shadow .2s;
  background: var(--sber-green); /* ТОЛЬКО ЗЕЛЕНЫЙ */
  box-shadow: 0 4px 12px rgba(33, 160, 56, 0.2);
}
.btn:hover{opacity:0.9; box-shadow: 0 6px 16px rgba(33, 160, 56, 0.3);}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.5;cursor:not-allowed; box-shadow:none;}

.btn.neutral { background: var(--input-bg); color: var(--text-main); box-shadow: none; border: 1px solid var(--border); }
.btn.neutral:hover { background: var(--border); }
.btn.ghost{background:var(--input-bg);color:var(--text-main); box-shadow:none;}
.btn.red{background:var(--red); box-shadow:0 4px 12px rgba(255,59,48,0.2);}
.btn.small{padding:8px 14px;font-size:13px;border-radius:8px;}
.btn.block{width:100%;}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;font-weight:500;}
.field input,.field select{
  width:100%;padding:14px 16px;border:none;border-radius:12px;font-size:16px;
  font-family:inherit;color:var(--text-main);background:var(--input-bg);outline:none;transition:box-shadow .2s;
}
.field input:focus{box-shadow:0 0 0 2px var(--sber-green);}
.field.error input{box-shadow:0 0 0 2px var(--red);}
.field .err-msg{color:var(--red);font-size:12px;margin-top:4px;display:none;}
.field.error .err-msg{display:block;}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.toast-wrap{position:fixed;top:16px;right:16px;left:16px;z-index:400;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
.toast{background:var(--text-main);color:var(--card-bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;animation:fadeIn .3s;}

/* --- МОДАЛЬНЫЕ ОКНА (ИСПРАВЛЕНО ДЛЯ МОБИЛЬНЫХ) --- */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: -webkit-fill-available;
  background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity .2s; overscroll-behavior: contain;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--card-bg); border-radius: 24px; width: 100%; max-width: 440px; max-height: 85vh;
  overflow-y: auto; padding: 24px; transform: translateY(20px); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  margin: auto; -webkit-overflow-scrolling: touch;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal h3{margin:0 0 16px;font-size:20px;font-weight:700;}
.modal .close-x{float:right;background:var(--input-bg);border:none;color:var(--text-main);width:32px;height:32px;border-radius:50%;cursor:pointer; transition:transform .1s;}
.modal .close-x:active{transform:scale(0.9);}

.treasury-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
.treasury{
  width:100%; max-width: 500px; color: #fff; border-radius: 24px; padding: 24px; 
  display:flex; flex-direction:column; align-items:flex-start; 
  box-shadow: 0 12px 30px rgba(33, 160, 56, 0.25);
  background: var(--sber-green);
  animation: popIn 0.4s ease both;
}
.treasury .label{font-size:14px; opacity:.9;}
.treasury .amount{font-size:36px; font-weight:700; margin:8px 0;}
.treasury .sub{font-size:13px; opacity:.8;}

.members-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:12px;}
.member-circle{background:var(--card-bg); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; align-items:flex-start; box-shadow:var(--shadow); cursor:pointer; transition:transform .1s; animation:fadeIn .3s ease both;}
.member-circle:active{transform:scale(.97);}
.member-circle .ava{width:48px;height:48px;border-radius:50%;margin-bottom:12px;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;}
.member-circle .ava img{width:100%;height:100%;object-fit:cover;}
.member-circle .mname{font-size:15px; font-weight:600; margin-bottom:4px;}
.member-circle .mcontrib{font-size:13px; color:var(--text-muted); margin-bottom:8px;}
.member-circle .mdebt{font-size:12px; color:var(--red); font-weight:600; background:var(--red-bg); padding:4px 8px; border-radius:8px;}
.member-circle .mdebt.none{color:var(--sber-green); background:var(--sber-green-bg);}

.table-wrap{overflow-x:auto; border-radius:var(--radius); background:var(--card-bg); box-shadow:var(--shadow);}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;}
table.tbl th,table.tbl td{padding:16px;text-align:left;border-bottom:1px solid var(--border);}
table.tbl th{color:var(--text-muted);font-size:12px;text-transform:uppercase;}
.amt-in{color:var(--sber-green);font-weight:600;}
.amt-out{color:var(--text-main);font-weight:600;}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;}
.badge.green{background:var(--sber-green-bg);color:var(--sber-green);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.blue{background:#eef2ff;color:#4f46e5;}

.auth-layout { min-height: 100vh; width: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn 0.3s ease;}
@media (min-width: 900px) {
  .auth-layout { justify-content: flex-start; padding-left: 10vw; background: #e8eaed; }
  [data-theme="dark"] .auth-layout { background: #000; }
}
.auth-box { background: var(--card-bg); border-radius: 32px; padding: 40px 32px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; animation: popIn 0.4s ease both; }
.auth-brand { text-align: center; margin-bottom: 32px; }
.auth-brand .logo { font-size: 28px; font-weight: 800; color: var(--sber-green); margin-bottom: 8px; }
.auth-brand h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
.auth-brand p { font-size: 14px; color: var(--text-muted); margin: 0; }
.auth-tabs { display: flex; background: var(--input-bg); border-radius: 16px; padding: 4px; margin-bottom: 24px; }
.auth-tabs button { flex: 1; border: none; background: transparent; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: background 0.2s; }
.auth-tabs button.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,.05); }

#pinScreen { position: fixed; inset: 0; z-index: 999; background: var(--sber-green); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding: 24px; animation: fadeIn 0.3s ease;}
.pin-content { width: 100%; max-width: 360px; display: flex; flex-direction: column; animation: slideUp 0.4s ease both;}
.pin-top { margin-bottom: 40px; text-align: center; }
.pin-top .ava-small { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px; color: #0b2e16; margin: 0 auto 16px; overflow: hidden; }
.pin-top .ava-small img { width: 100%; height: 100%; object-fit: cover; }
.pin-top .uname { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.pin-top .uhint { font-size: 14px; opacity: 0.7; margin-bottom: 24px; }
.pin-dots { display: flex; justify-content: center; gap: 12px; }
.pin-dots .dot { width: 48px; height: 56px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
.pin-dots .dot::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity 0.2s; }
.pin-dots .dot.filled::after { opacity: 1; }
.pin-dots.shake { animation: shake .4s; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pin-pad button { height: 64px; border: none; border-radius: 16px; background: #fff; color: #000; font-size: 24px; font-weight: 500; cursor: pointer; transition: transform .1s; }
.pin-pad button:active { transform: scale(.95); background: #f0f0f0; }
.pin-pad button.fn { background: transparent; color: #fff; font-size: 14px; font-weight: 500; border: none; transition: background .2s; }
.pin-pad button.fn:active { background: rgba(255,255,255,0.1); }

.avatar-edit{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.avatar-preview{width:80px;height:80px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;font-weight:600;}
.avatar-preview img{width:100%;height:100%;object-fit:cover;}
.theme-toggle { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card-bg); border-radius: var(--radius); margin-bottom: 16px; }
.switch { position: relative; display: inline-block; width: 50px; height: 28px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--input-bg); transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--sber-green); }
input:checked + .slider:before { transform: translateX(22px); }
.bank-card{width: 100%; max-width: 420px; aspect-ratio: 1.586 / 1; border-radius: 20px; background: #000; color: #fff; padding: 24px; display: flex; gap: 20px; position: relative; overflow: hidden; animation: popIn 0.4s ease both;}
.bank-card::before{content:'';position:absolute;top:-50%;right:-20%;width:70%;height:150%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%);}
.bank-card .qr-side{width: 36%; background: #fff; border-radius: 12px; padding: 8px; display: flex; align-items: center; justify-content: center; align-self: center;}
.bank-card .qr-side img, .bank-card .qr-side canvas{width:100%;height:auto;}
.bank-card .data-side{flex:1;display:flex;flex-direction:column;justify-content:center;}
.bank-card .card-num{font-family:monospace;font-size:16px;letter-spacing:2px;font-weight:600;margin:8px 0;color:var(--sber-green);}
.bank-card.blocked{filter:grayscale(1) brightness(.8);}

footer.disclaimer{text-align:center;padding:24px 16px;font-size:12px;color:var(--text-muted);margin-top:auto;}
.bottom-nav {position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--card-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 100;}
.bottom-nav a {display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 500; cursor: pointer; transition: color 0.2s;}
.bottom-nav a.active { color: var(--sber-green); }
.bottom-nav a svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.bottom-nav .logout-btn { color: var(--red); }

@media (min-width: 900px) {
  body { padding-bottom: 0; padding-left: 260px; }
  .bottom-nav { display: none; }
  .drawer {display: flex; position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: var(--bg); flex-direction: column; padding: 24px 16px; border-right: 1px solid var(--border); z-index: 100;}
  .drawer-head { padding: 0 12px 24px; margin-bottom: 16px;}
  .drawer-head .brand { font-size: 16px; font-weight: 700; color: var(--text-main);}
  .drawer nav { flex: 1; }
  .drawer nav a {display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: var(--text-main); font-weight: 500; font-size: 15px; margin-bottom: 4px; cursor: pointer; transition: background 0.2s;}
  .drawer nav a:hover { background: var(--input-bg); }
  .drawer nav a.active { background: var(--card-bg); color: var(--sber-green); font-weight: 600; box-shadow: var(--shadow); }
  .drawer nav a svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .drawer-foot { border-top: 1px solid var(--border); padding-top: 16px; }
  .drawer-foot a { color: var(--red); display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-weight: 500; cursor: pointer;}
  .drawer-foot a svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  main.page { padding: 32px; max-width: 1000px; margin: 0 auto; }
  .treasury-wrap { flex-direction: row; align-items: stretch; }
  .treasury { flex: 1; max-width: none; }
}

#loadingScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000; animation: fadeIn 0.4s ease both;}
#loadingScreen.hide{animation:fadeOut .5s ease both;}
.loading-landscape{position:absolute;inset:0;background-size:cover;background-position:center;transition: background-image 0.5s; opacity:0.9;}
.loading-landscape::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
.loading-greeting{position:absolute;top:40px;left:40px;font-size:28px;font-weight:700;color:#fff;z-index:2; text-shadow: 0 2px 10px rgba(0,0,0,.5);}
.loading-ring-wrap{position:relative;width:120px;height:120px;z-index:2;}
.loading-ring{width:100%;height:100%;transform:rotate(-90deg);}
.loading-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:6;}
.loading-ring .ring-fg{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .25s linear;}
.loading-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<div id="loadingScreen" style="display:none">
  <div class="loading-landscape" id="loadingLandscape"></div>
  <div class="loading-greeting" id="loadingGreeting">Добрый день!</div>
  <div class="loading-ring-wrap">
    <svg class="loading-ring" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" class="ring-bg"/>
      <circle cx="50" cy="50" r="42" class="ring-fg" id="ringFg"/>
    </svg>
    <div class="loading-pct" id="loadingPct">0%</div>
  </div>
</div>
<audio id="upfSound" src="UPF.mp3" preload="auto"></audio>

<script>
'use strict';

const LS = { users:'upf_users', operations:'upf_operations', loans:'upf_loans', cards:'upf_cards', requests:'upf_requests', config:'upf_config', remembered:'upf_remembered' };
const SS = { session:'upf_session', pinFail:'upf_pin_fail', adminSessionId:'upf_admin_sess' };
const IDLE_LIMIT_MS = 5*60*1000;
const LOAN_PERCENT = 10;
const LOAN_TERM_DAYS = 30;
const ADMIN_EMAIL = 'flypecorp@gmail.com';
const ADMIN_PASS  = 'FlypeAdmin#Root2026!';
const ADMIN_DEFAULT_PIN = '00000';

const lsGet=(k,d)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}};
const lsSet=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const ssGet=(k,d)=>{try{const r=sessionStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}};
const ssSet=(k,v)=>sessionStorage.setItem(k,JSON.stringify(v));
const ssDel=k=>sessionStorage.removeItem(k);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const fmtMoney=n=>{const x=Number(n)||0;return x.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₽'};
const fmtDate=iso=>{const d=new Date(iso);return isNaN(d)?'—':d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})};
const fmtDateTime=iso=>{const d=new Date(iso);return isNaN(d)?'—':d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const initials=fio=>String(fio||'').trim().split(/\s+/).slice(0,2).map(w=>w.charAt(0).toUpperCase()).join('')||'?';
const randomDigits=len=>{let s='';for(let i=0;i<len;i++)s+=Math.floor(Math.random()*10);return s};
const isEmailGmail=e=>/^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(String(e||'').trim());
const isPin5=p=>/^\d{5}$/.test(String(p||''));

const SHA256 = (function(){

function getTreasuryBalance(){
  let bal=0;
  for(const op of getOps()){
    if(op.type==='contribute')bal+=op.amount; else if(op.type==='loan_out')bal-=op.amount; else if(op.type==='loan_return')bal+=op.amount; else if(op.type==='personal_to_treasury')bal+=op.amount; else if(op.type==='admin_treasury_out')bal-=op.amount;
  }
  return Math.max(0,bal);
}
function getUserContributed(userId){
  let s=0;
  for(const op of getOps().filter(o=>o.userId===userId)){ if(op.type==='contribute'||op.type==='personal_to_treasury')s+=op.amount; }
  return s;
}
function getPersonalBalance(userId){
  let b=0;
  for(const op of getOps().filter(o=>o.userId===userId || o.targetUserId===userId)){
    if(op.type==='personal_deposit' && op.userId===userId) b+=op.amount;
    else if(op.type==='personal_withdraw' && op.userId===userId) b-=op.amount;
    else if(op.type==='personal_to_treasury' && op.userId===userId) b-=op.amount;
    else if(op.type==='transfer_out' && op.userId===userId) b-=op.amount;
    else if(op.type==='transfer_in' && op.targetUserId===userId) b+=op.amount;
  }
  return Math.max(0,b);
}

      const loan={id:loanId,userId,userName,amount:amt,percent:LOAN_PERCENT,takenAt:ts,dueDate:due.toISOString(),status:'active',requestId};
      const loans=getLoans();loans.push(loan);saveLoans(loans); if(_fbReady)await fbSet('loans/'+loanId,loan);
      await pushOp({type:'loan_out',amount:amt,comment:'Списание из казны на заём'}); await pushOp({type:'personal_deposit',amount:amt,comment:'Зачисление займа на личный'}); break;
    }
    case REQ_TYPE.RETURN_LOAN:{
      if(getPersonalBalance(userId)<amt)throw new Error(ADMIN_COMMENTS.noMoney); const loan=getActiveLoan(userId); if(!loan)throw new Error('Нет активного займа');
      const loans=getLoans();const l=loans.find(x=>x.id===loan.id); if(l){l.status='returned';l.returnedAt=ts;l.requestId=requestId} saveLoans(loans); if(_fbReady)await fbUpdate('loans/'+loan.id,{status:'returned',returnedAt:ts,requestId});
      await pushOp({type:'personal_withdraw',amount:amt,comment:'Списание с личного на возврат'}); await pushOp({type:'loan_return',amount:amt,comment:'Возврат займа в казну'}); break;
    }
    default: throw new Error('Неизвестный тип: '+type);
  }
}

async function instantAction(type,payload){
  const sess=getSession(); if(!sess)throw new Error('Нет сессии'); const me=sess.user; const ts=nowISO();
  const pushOp=async(op)=>{ const id=uid(); const full={id,userId:me.id,userName:me.fio,ts,...op}; const ops=getOps();ops.push(full);saveOps(ops); if(_fbReady)await fbSet('operations/'+id,full); return full; };
  
  if(type===REQ_TYPE.PERSONAL_DEPOSIT){
    const amt=Number(payload.amount); if(!isFinite(amt)||amt<=0)throw new Error('Сумма некорректна');
    await pushOp({type:'personal_deposit',amount:amt,comment:'Пополнение'});
  }
  else if(type===REQ_TYPE.PERSONAL_WITHDRAW){
    const amt=Number(payload.amount); if(!isFinite(amt)||amt<=0)throw new Error('Сумма некорректна');
    if(getPersonalBalance(me.id)<amt)throw new Error('Недостаточно средств');
    await pushOp({type:'personal_withdraw',amount:amt,comment:'Снятие'});
  }
  else if(type===REQ_TYPE.ISSUE_CARD){
    if(getUserCard(me.id))throw new Error('Карта уже оформлена');
    const cardId=uid(); const card={id:cardId,userId:me.id,userName:me.fio,number:genCardNumber(),code:genCardCode(),status:'active',issuedAt:ts};
    const cards=getCards();cards.push(card);saveCards(cards); if(_fbReady)await fbSet('cards/'+cardId,card);
  }
  else if(type==='transfer'){
    const amt=Number(payload.amount); const targetId=payload.targetUserId;
    if(!isFinite(amt)||amt<=0)throw new Error('Сумма некорректна');
    if(targetId===me.id)throw new Error('Нельзя перевести себе');
    if(getPersonalBalance(me.id)<amt)throw new Error('Недостаточно средств на личном счёте');
    const target=getUserById(targetId); if(!target)throw new Error('Получатель не найден');
    
    // Списание у отправителя
    await pushOp({type:'transfer_out',amount:amt,comment:`Перевод для ${target.fio}`,targetUserId:target.id});
    // Зачисление получателю
    const id=uid(); const full={id,userId:target.id,userName:target.fio,ts,type:'transfer_in',amount:amt,comment:`Перевод от ${me.fio}`,targetUserId:me.id};
    const ops=getOps();ops.push(full);saveOps(ops); if(_fbReady)await fbSet('operations/'+id,full);
  }
}

async function createRequest(type,payload){
  const sess=getSession(); if(!sess)throw new Error('Нет сессии'); const me=sess.user; if(me.blocked)throw new Error('Аккаунт заблокирован');
  if([REQ_TYPE.CONTRIBUTE,REQ_TYPE.RETURN_LOAN].includes(type)){ const bal=getPersonalBalance(me.id); const amt=Number(payload.amount)||0; if(amt>bal)throw new Error('Недостаточно средств на личном счёте. Доступно: '+fmtMoney(bal)); }
  if(type===REQ_TYPE.TAKE_LOAN){ const tre=getTreasuryBalance(); const amt=Number(payload.amount)||0; if(amt>tre)throw new Error('Нельзя занять больше, чем в казне ('+fmtMoney(tre)+').'); if(getActiveLoan(me.id))throw new Error('У вас уже есть активный заём.'); }
  if(type===REQ_TYPE.RETURN_LOAN&&!getActiveLoan(me.id))throw new Error('Нет активного займа.');
  if(type===REQ_TYPE.BLOCK_CARD&&!getUserCard(me.id))throw new Error('Карты нет.');
  
  const req={id:uid(),type,userId:me.id,userName:me.fio,payload,status:'pending',adminComment:'',createdAt:nowISO(),reviewedAt:null,reviewedBy:null};
  const reqs=getRequests(); reqs.push(req); saveRequests(reqs); if(_fbReady)await fbSet('requests/'+req.id,req); return req;
}

async function approveRequest(requestId,commentKey){
  const sess=getSession(); if(!sess||sess.user.role!=='admin')throw new Error('Только админ');
  const reqs=getRequests(); const req=reqs.find(r=>r.id===requestId); if(!req||req.status!=='pending')return;
  const comment=ADMIN_COMMENTS[commentKey]||ADMIN_COMMENTS.ok;
  try{
    await executeApprovedOperation(req);
    req.status='approved'; req.adminComment=comment; req.reviewedAt=nowISO(); req.reviewedBy=sess.user.id; saveRequests(reqs);
    if(_fbReady)await fbUpdate('requests/'+req.id,{status:'approved',adminComment:comment,reviewedAt:req.reviewedAt,reviewedBy:req.reviewedBy});
    toast('Одобрено: '+comment,'ok');
  }catch(e){ toast('Ошибка: '+e.message,'err'); throw e; }
}

async function rejectRequest(requestId,commentKey){
  const sess=getSession(); if(!sess||sess.user.role!=='admin')throw new Error('Только админ');
  const reqs=getRequests(); const req=reqs.find(r=>r.id===requestId); if(!req||req.status!=='pending')return;
  const comment=ADMIN_COMMENTS[commentKey]||ADMIN_COMMENTS.noMoney;
  req.status='rejected'; req.adminComment=comment; req.reviewedAt=nowISO(); req.reviewedBy=sess.user.id; saveRequests(reqs);
  if(_fbReady)await fbUpdate('requests/'+req.id,{status:'rejected',adminComment:comment,reviewedAt:req.reviewedAt,reviewedBy:req.reviewedBy});
  toast('Отклонено: '+comment,'ok');
}

async function adminAction(type,payload){
  const sess=getSession(); if(!sess||sess.user.role!=='admin')throw new Error('Только админ'); const admin=sess.user; const ts=nowISO();
  const pushOp=async(op)=>{ const id=uid(); const full={id,ts,...op}; const ops=getOps();ops.push(full);saveOps(ops); if(_fbReady)await fbSet('operations/'+id,full); };
  switch(type){
    case REQ_TYPE.ADMIN_ADD_TREASURY:{ const amt=Number(payload.amount); if(!isFinite(amt)||amt<=0)throw new Error('Некорректная сумма'); await pushOp({type:'contribute',userId:admin.id,userName:admin.fio,amount:amt,comment:'Админ: пополнение казны',byAdmin:true}); break; }
    case REQ_TYPE.ADMIN_REMOVE_TREASURY:{ const amt=Number(payload.amount); if(!isFinite(amt)||amt<=0)throw new Error('Некорректная сумма'); if(getTreasuryBalance()<amt)throw new Error('Недостаточно средств'); await pushOp({type:'admin_treasury_out',userId:admin.id,userName:admin.fio,amount:amt,comment:'Админ: изъятие из казны',byAdmin:true}); break; }
    case REQ_TYPE.ADMIN_ADD_PERSONAL:{ const amt=Number(payload.amount); if(!isFinite(amt)||amt<=0)throw new Error('Некорректная сумма'); await pushOp({type:'personal_deposit',userId:payload.targetUserId,userName:payload.targetUserName,amount:amt,comment:'Админ: пополнение',byAdmin:true}); break; }
    case REQ_TYPE.ADMIN_ADD_DEBT:{ const amt=Number(payload.amount); if(!isFinite(amt)||amt<=0)throw new Error('Некорректная сумма'); const due=new Date();due.setDate(due.getDate()+LOAN_TERM_DAYS); const loanId=uid(); const loan={id:loanId,userId:payload.targetUserId,userName:payload.targetUserName,amount:amt,percent:0,takenAt:ts,dueDate:due.toISOString(),status:'active',byAdmin:true,comment:'Долг введён админом'}; const loans=getLoans();loans.push(loan);saveLoans(loans); if(_fbReady)await fbSet('loans/'+loanId,loan); break; }
    case REQ_TYPE.ADMIN_CANCEL_DEBT:{ const loan=getActiveLoan(payload.targetUserId); if(!loan)throw new Error('Нет активного долга'); const loans=getLoans();const l=loans.find(x=>x.id===loan.id); if(l){l.status='cancelled';l.cancelledAt=ts;l.byAdmin=true;} saveLoans(loans); if(_fbReady)await fbUpdate('loans/'+loan.id,{status:'cancelled',cancelledAt:ts,byAdmin:true}); break; }
    case REQ_TYPE.ADMIN_BLOCK_USER:{ const users=getUsers();const u=users.find(x=>x.id===payload.targetUserId); if(!u)throw new Error('Не найден'); u.blocked=true;u.blockedAt=ts; saveUsers(users); if(_fbReady)await fbUpdate('users/'+u.id,{blocked:true,blockedAt:ts}); break; }
    case REQ_TYPE.ADMIN_BLOCK_CARD:{ const card=getUserCard(payload.targetUserId); if(!card)throw new Error('Карта не найдена'); const cards=getCards();const c=cards.find(x=>x.id===card.id); if(c)c.status='blocked'; saveCards(cards); if(_fbReady)await fbUpdate('cards/'+card.id,{status:'blocked',blockedAt:ts}); break; }
    case REQ_TYPE.ADMIN_RESET_ACCOUNT:{ const loans=getLoans().filter(l=>l.userId===payload.targetUserId&&l.status==='active'); for(const l of loans){ l.status='cancelled';l.cancelledAt=ts;l.byAdmin=true; if(_fbReady)await fbUpdate('loans/'+l.id,{status:'cancelled',cancelledAt:ts,byAdmin:true}); } saveLoans(getLoans()); const bal=getPersonalBalance(payload.targetUserId); if(bal>0){ await pushOp({type:'personal_withdraw',userId:payload.targetUserId,userName:payload.targetUserName,amount:bal,comment:'Админ: сброс счёта',byAdmin:true}); } break; }
    default: throw new Error('Неизвестное действие');
  }
  toast('Операция выполнена.','ok');
}

function parseHash(){ const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); const params=new URLSearchParams(qs||''); return {path:path||(getSession()?'index':'login'),params}; }
function navigate(path,params){ let h='#/'+path; if(params){ const q=new URLSearchParams(params).toString(); if(q)h+='?'+q; } if(location.hash===h)route(); else location.hash=h; }

async function route(){
  const {path,params}=parseHash();
  const maint=await getMaintenance(); const sess=getSession();
  if(maint&&maint.enabled&&(!sess||sess.user.role!=='admin')){
    document.getElementById('app').innerHTML=`<div class="auth-layout"><div class="auth-box" style="text-align:center"><div class="auth-brand"><div class="logo">УПФ</div><h1>Технические работы</h1></div><p style="font-size:16px;margin:20px 0">К сожалению, доступ временно ограничен из-за ведущихся технических работ.</p><p class="text-muted">${esc(maint.comment||'Скоро вернёмся!')}</p></div></div>`;
    return;
  }
  if(!sess&&path!=='login'){location.replace('#/login');return}
  if(sess&&path==='login'){location.replace('#/index');return}
  if(sess&&sess.user.blocked){clearSession();location.replace('#/login?reason=blocked');return}
  const fn=routes[path]||renderIndex; closeAllModals(); window.scrollTo(0,0); await fn(params);
}

  const lf = document.getElementById('loginForm');
  if(lf){
    lf.addEventListener('submit', async e=>{
      e.preventDefault(); clearErrors(); showMsg('loginMsg','');
      const email=document.getElementById('loginEmail').value.trim().toLowerCase(); const pass=document.getElementById('loginPass').value;
      try{await syncFromFirebase()}catch(e){}
      const u=getUserByEmail(email); if(!u){showMsg('loginMsg','Пользователь не найден','err');return}
      if(!verifyHash(pass,u.pass.salt,u.pass.hash)){showMsg('loginMsg','Неверный пароль','err');return}
      if(u.blocked){showMsg('loginMsg','Аккаунт заблокирован','err');return}
      await doLoginSuccess(u);
    });
  }

  const rf = document.getElementById('regForm');
  if(rf){
    rf.addEventListener('submit', async e=>{
      e.preventDefault(); clearErrors();
      const lastname=document.getElementById('regLastname').value.trim(); const name=document.getElementById('regName').value.trim(); const patronymic=document.getElementById('regPatronymic').value.trim(); const email=document.getElementById('regEmail').value.trim().toLowerCase(); const pass=document.getElementById('regPass').value; const pin=document.getElementById('regPin').value;
      if(!lastname||!name||!email||!pass||!pin){showMsg('regMsg','Заполните все поля','err');return}
      const u={id:uid(), lastname,name,patronymic, fio:`${lastname} ${name} ${patronymic}`, email, pass:makeHash(pass), pin:makeHash(pin), avatar:'', role:'member', status:'active', blocked:false, createdAt:nowISO()};
      const users=getUsers(); users.push(u); saveUsers(users);
      if(_fbReady) await fbSet('users/'+u.id,u);
      showMsg('regMsg','Регистрация успешна! Войдите.','ok');
      setTimeout(()=>{ document.querySelector('#authTabs button[data-tab="login"]').click(); document.getElementById('loginEmail').value=email; }, 1000);
    });
  }
}

  `);
  bindShell('card');startIdle(); const $=id=>document.getElementById(id);
  function render(){ const card=getUserCard(me.id); if(!card){ $('noCard').style.display='block';$('cardBox').style.display='none'; }else{ $('noCard').style.display='none';$('cardBox').style.display='block'; $('cardFio').textContent=me.fio; const n=card.number; $('cardNum').textContent=n.slice(0,4)+' '+n.slice(4,8)+' '+n.slice(8,10); $('cardCode').textContent=card.code; $('bankCard').classList.toggle('blocked',card.status==='blocked'); drawQR($('qrSide'),JSON.stringify({n:card.number,c:card.code})); } }
  $('btnIssueCard').addEventListener('click',async()=>{ try{await instantAction(REQ_TYPE.ISSUE_CARD,{});render();toast('Карта оформлена','ok')}catch(e){toast(e.message,'err')} });
  $('btnBlockCard').addEventListener('click',async()=>{ try{await createRequest(REQ_TYPE.BLOCK_CARD,{});toast('Заявка на блокировку отправлена','ok')}catch(e){toast(e.message,'err')} });
  if(me.role==='admin'){
    $('btnScanCard').addEventListener('click',()=>{
      const num=$('scanNumber').value.trim(); const code=$('scanCode').value.trim();
      const card=getCards().find(c=>c.number===num&&c.code===code); if(!card){toast('Не найдено','err');return}
      const user=getUserById(card.userId); $('adminOpsBody').innerHTML=`<b>${esc(user.fio)}</b>`; openModal('adminOpsModal');
    });
  }
  render();
}

async function renderAccount(){
  const sess=getSession();if(!sess)return; let me=sess.user;
  const savedTheme = localStorage.getItem('upf_theme') || 'light'; document.documentElement.setAttribute('data-theme', savedTheme);

  document.getElementById('app').innerHTML=shell('account',`
    <h2 class="page-title">Аккаунт</h2>
    <div class="theme-toggle">
      <span>Тёмная тема</span>
      <label class="switch"><input type="checkbox" id="themeToggle" ${savedTheme === 'dark' ? 'checked' : ''}><span class="slider"></span></label>
    </div>
    <div class="card">
      <div class="avatar-edit"><div class="avatar-preview" id="avatarPreview"></div><div><button class="btn ghost small" id="btnAvatar">Изменить фото</button><input type="file" id="avatarInput" accept="image/*" style="display:none"></div></div>
      <h3 style="margin:20px 0 4px" id="profileFio">—</h3><p class="text-muted" id="profileEmail" style="margin:0">—</p>
    </div>
    <div class="card"><h3 style="margin-top:0">Сменить ФИО</h3><div class="row-2"><div class="field"><label>Фамилия</label><input type="text" id="chLastname"></div><div class="field"><label>Имя</label><input type="text" id="chName"></div></div><div class="field"><label>Отчество</label><input type="text" id="chPatronymic"></div><button class="btn" id="btnChangeFio">Сохранить</button></div>
    <div class="card"><h3 style="margin-top:0">Сменить пароль</h3><div class="field"><label>Старый</label><input type="password" id="oldPass"></div><div class="field"><label>Новый</label><input type="password" id="newPass"></div><button class="btn" id="btnChangePass">Сменить</button></div>
    <div class="card"><h3 style="margin-top:0">Сменить PIN</h3><div class="field"><label>Пароль</label><input type="password" id="pinPass"></div><div class="field"><label>Новый PIN</label><input type="password" id="newPin" maxlength="5"></div><button class="btn" id="btnChangePin">Сменить</button></div>
  `);
  bindShell('account');startIdle(); const $=id=>document.getElementById(id);
  function renderProfile(){ const prev=$('avatarPreview'); if(me.avatar)prev.innerHTML=`<img src="${me.avatar}" alt="">`; else prev.textContent=initials(me.fio); $('profileFio').textContent=me.fio; $('profileEmail').textContent=me.email; $('chLastname').value=me.lastname||''; $('chName').value=me.name||''; $('chPatronymic').value=me.patronymic||''; }
  renderProfile();
  const toggle = document.getElementById('themeToggle'); if(toggle){ toggle.addEventListener('change', (e) => { const theme = e.target.checked ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('upf_theme', theme); }); }
  $('btnAvatar').addEventListener('click',()=>$('avatarInput').click());
  $('avatarInput').addEventListener('change',e=>{ const f=e.target.files[0];if(!f)return; cropAvatar(f,200,async dataUrl=>{ const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return; u.avatar=dataUrl;saveUsers(users); if(_fbReady)await fbUpdate('users/'+u.id,{avatar:dataUrl}); me=getUserById(me.id); renderProfile();toast('Обновлено','ok'); }); });
  $('btnChangeFio').addEventListener('click',async()=>{ const lastname=$('chLastname').value.trim(),name=$('chName').value.trim(),patronymic=$('chPatronymic').value.trim(); if(!lastname||!name){toast('Заполните','err');return} const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return; u.lastname=lastname;u.name=name;u.patronymic=patronymic;u.fio=`${lastname} ${name} ${patronymic}`;saveUsers(users); if(_fbReady)await fbUpdate('users/'+u.id,{lastname,name,patronymic,fio:u.fio}); me=getUserById(me.id);renderProfile();toast('Сохранено','ok'); });
  $('btnChangePass').addEventListener('click',async()=>{ const oldP=$('oldPass').value,newP=$('newPass').value; if(!verifyHash(oldP,me.pass.salt,me.pass.hash)){toast('Неверный пароль','err');return} if(newP.length<6){toast('Мин. 6 символов','err');return} const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return; u.pass=makeHash(newP);saveUsers(users); if(_fbReady)await fbUpdate('users/'+u.id,{pass:u.pass}); me=getUserById(me.id); $('oldPass').value='';$('newPass').value=''; toast('Пароль сменён','ok'); });
  $('btnChangePin').addEventListener('click',async()=>{ const pass=$('pinPass').value,pin=$('newPin').value; if(!verifyHash(pass,me.pass.salt,me.pass.hash)){toast('Неверный пароль','err');return} if(!isPin5(pin)){toast('5 цифр','err');return} const users=getUsers();const u=users.find(x=>x.id===me.id);if(!u)return; u.pin=makeHash(pin);saveUsers(users); if(_fbReady)await fbUpdate('users/'+u.id,{pin:u.pin}); me=getUserById(me.id); $('pinPass').value='';$('newPin').value=''; toast('PIN сменён','ok'); });
}

(async function init(){
  if(!lsGet(LS.config,null)){ lsSet(LS.config,{loanPercent:LOAN_PERCENT,loanTermDays:LOAN_TERM_DAYS}); }
  try{ await ensureFirebaseAuth(); await syncFromFirebase(); await ensureAdminExists(); await syncFromFirebase(); startRealtimeSync(); }catch(e){ console.warn('Firebase offline',e.message); }
  if(!location.hash)location.replace('#/login');
  await route();
})();
</script>
