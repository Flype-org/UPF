<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Семейная касса УПФ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-box" id="authBox">
      <div class="auth-brand">
        <div class="logo">УПФ</div>
        <h1>Семейная касса УПФ</h1>
        <p>УралПромФонд</p>
      </div>

      <!-- ============ ЭКРАН БЫСТРОГО PIN-ВХОДА ============ -->
      <div id="pinScreen" style="display:none">
        <div class="pin-user">
          <div class="ava" id="pinAva">?</div>
          <div class="uname" id="pinName">Пользователь</div>
          <div class="uhint">Введите PIN-код для быстрого входа</div>
        </div>

        <div class="pin-dots" id="pinDots">
          <span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span>
          <span class="dot"></span>
        </div>

        <div id="pinLocked" class="pin-locked" style="display:none">
          Быстрый вход временно заблокирован.<br>
          Выполните полный вход по email и паролю.
        </div>

        <div class="pin-pad" id="pinPad">
          <button data-k="1">1</button>
          <button data-k="2">2</button>
          <button data-k="3">3</button>
          <button data-k="4">4</button>
          <button data-k="5">5</button>
          <button data-k="6">6</button>
          <button data-k="7">7</button>
          <button data-k="8">8</button>
          <button data-k="9">9</button>
          <button class="fn" data-k="switch">Другой вход</button>
          <button data-k="0">0</button>
          <button class="fn del" data-k="del">⌫</button>
        </div>

        <div class="center mt-16">
          <button class="link-btn" id="toFullFromPin">Войти по email и паролю</button>
        </div>
      </div>

      <!-- ============ ЭКРАН ПОЛНОГО ВХОДА ============ -->
      <div id="fullScreen" style="display:none">
        <div class="auth-tabs" id="authTabs">
          <button data-tab="login" class="active">Вход</button>
          <button data-tab="register">Регистрация</button>
        </div>

        <!-- Вход -->
        <form id="loginForm" novalidate>
          <div class="field" id="f-login-email">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@gmail.com" autocomplete="email">
            <div class="err-msg" id="e-login-email"></div>
          </div>
          <div class="field" id="f-login-pass">
            <label>Пароль</label>
            <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password">
            <div class="err-msg" id="e-login-pass"></div>
          </div>
          <div id="loginMsg"></div>
          <button class="btn block" type="submit">Войти</button>
          <div class="center mt-10">
            <button class="link-btn" type="button" id="toPinFromFull" style="display:none">
              Быстрый вход по PIN
            </button>
          </div>
        </form>

        <!-- Регистрация -->
        <form id="regForm" style="display:none" novalidate>
          <div class="row-2">
            <div class="field" id="f-reg-lastname">
              <label>Фамилия</label>
              <input type="text" id="regLastname" placeholder="Иванов">
              <div class="err-msg" id="e-reg-lastname"></div>
            </div>
            <div class="field" id="f-reg-name">
              <label>Имя</label>
              <input type="text" id="regName" placeholder="Иван">
              <div class="err-msg" id="e-reg-name"></div>
            </div>
          </div>
          <div class="field" id="f-reg-patronymic">
            <label>Отчество</label>
            <input type="text" id="regPatronymic" placeholder="Иванович">
            <div class="err-msg" id="e-reg-patronymic"></div>
          </div>
          <div class="field" id="f-reg-email">
            <label>Email (только @gmail.com)</label>
            <input type="email" id="regEmail" placeholder="you@gmail.com">
            <div class="err-msg" id="e-reg-email"></div>
          </div>
          <div class="row-2">
            <div class="field" id="f-reg-pass">
              <label>Пароль (мин. 6)</label>
              <input type="password" id="regPass" placeholder="••••••">
              <div class="err-msg" id="e-reg-pass"></div>
            </div>
            <div class="field" id="f-reg-pass2">
              <label>Повтор пароля</label>
              <input type="password" id="regPass2" placeholder="••••••">
              <div class="err-msg" id="e-reg-pass2"></div>
            </div>
          </div>
          <div class="field" id="f-reg-pin">
            <label>PIN-код быстрого входа (5 цифр)</label>
            <input type="password" id="regPin" inputmode="numeric" maxlength="5" placeholder="•••••">
            <div class="hint">По этому PIN вы сможете входить без пароля на этом устройстве.</div>
            <div class="err-msg" id="e-reg-pin"></div>
          </div>
          <div id="regMsg"></div>
          <button class="btn green block" type="submit">Зарегистрироваться</button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
  /* ============================================================
     Логика экрана входа / регистрации
     ============================================================ */

  const authBox = document.getElementById('authBox');
  const pinScreen = document.getElementById('pinScreen');
  const fullScreen = document.getElementById('fullScreen');

  /* --- Проверка: может ли пользователь войти --- */
  function canLogin(user) {
    if (!user) return { ok: false, msg: 'Пользователь не найден.' };
    if (user.role === 'admin') return { ok: true };
    if (user.status === 'active') return { ok: true };
    if (user.status === 'pending') return { ok: false, msg: 'Ваша заявка ещё на рассмотрении администратором.' };
    if (user.status === 'rejected') return { ok: false, msg: 'Ваша заявка отклонена администратором.' };
    return { ok: false, msg: 'Доступ запрещён.' };
  }

  /* --- Отображение сообщения под формой --- */
  function showMsg(elId, text, type) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = text ? `<div class="badge ${type === 'err' ? 'red' : 'green'}" style="display:block;margin-bottom:12px;padding:10px 14px;border-radius:10px">${esc(text)}</div>` : '';
  }

  /* --- Сообщение о причине завершения сессии (из query string) --- */
  const params = new URLSearchParams(location.search);
  const reason = params.get('reason');
  if (reason === 'idle') {
    showMsg('loginMsg', 'Сессия завершена из-за бездействия.', 'err');
    // покажем на PIN-экране тоже
    setTimeout(() => {
      const lm = document.getElementById('loginMsg');
      if (lm && !lm.innerHTML) showMsg('loginMsg', 'Сессия завершена из-за бездействия.', 'err');
    }, 0);
  } else if (reason === 'logout') {
    showMsg('loginMsg', 'Вы вышли из системы.', 'ok');
  }

  /* --- Определяем стартовый экран: PIN или полный вход --- */
  const remembered = readLS(LS.remembered, null);
  let rememberedUser = null;
  if (remembered && remembered.userId) {
    rememberedUser = getUserById(remembered.userId);
  }

  // Счётчик неверных попыток PIN для текущей сессии страницы
  let pinAttempts = 0;
  const PIN_MAX_ATTEMPTS = 3;
  let pinBuffer = '';

  function showPinScreen() {
    pinScreen.style.display = 'block';
    fullScreen.style.display = 'none';
    if (rememberedUser) {
      const ava = document.getElementById('pinAva');
      if (rememberedUser.avatar) {
        ava.innerHTML = `<img src="${rememberedUser.avatar}" alt="">`;
      } else {
        ava.textContent = initials(rememberedUser.fio);
      }
      document.getElementById('pinName').textContent = rememberedUser.fio || rememberedUser.email;
    }
    updatePinDots();
    // при возврате на PIN-экран — покажем блокировку, если попытки исчерпаны
    updatePinLockState();
  }

  function showFullScreen(tab) {
    pinScreen.style.display = 'none';
    fullScreen.style.display = 'block';
    switchTab(tab || 'login');
    // кнопка «Быстрый вход по PIN» показывается, если есть запомненный пользователь
    const toPin = document.getElementById('toPinFromFull');
    toPin.style.display = rememberedUser ? 'inline-block' : 'none';
  }

  function switchTab(tab) {
    document.querySelectorAll('#authTabs button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('regForm').style.display = tab === 'register' ? 'block' : 'none';
  }

  /* --- PIN: точки и ввод --- */
  function updatePinDots() {
    const dots = document.querySelectorAll('#pinDots .dot');
    dots.forEach((d, i) => d.classList.toggle('filled', i < pinBuffer.length));
  }
  function updatePinLockState() {
    const locked = pinAttempts >= PIN_MAX_ATTEMPTS;
    document.getElementById('pinLocked').style.display = locked ? 'block' : 'none';
    document.getElementById('pinPad').style.display = locked ? 'none' : 'grid';
    const toFull = document.getElementById('toFullFromPin');
    toFull.textContent = locked ? 'Войти по email и паролю' : 'Войти по email и паролю';
  }
  function resetPinBuffer() {
    pinBuffer = '';
    updatePinDots();
  }
  function shakeDots() {
    const d = document.getElementById('pinDots');
    d.classList.add('shake');
    setTimeout(() => d.classList.remove('shake'), 450);
  }

  document.getElementById('pinPad').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const k = btn.dataset.k;

    if (k === 'switch') { showFullScreen('login'); return; }
    if (k === 'del') {
      pinBuffer = pinBuffer.slice(0, -1);
      updatePinDots();
      return;
    }
    if (pinAttempts >= PIN_MAX_ATTEMPTS) return;
    if (pinBuffer.length >= 5) return;
    pinBuffer += k;
    updatePinDots();

    if (pinBuffer.length === 5) {
      // проверяем PIN
      const pin = pinBuffer;
      if (!rememberedUser || !rememberedUser.pin) {
        shakeDots();
        pinAttempts++;
        resetPinBuffer();
        updatePinLockState();
        return;
      }
      const ok = await verifyHash(pin, rememberedUser.pin.salt, rememberedUser.pin.hash);
      if (ok) {
        const check = canLogin(rememberedUser);
        if (!check.ok) {
          shakeDots();
          showMsg('loginMsg', check.msg, 'err');
          resetPinBuffer();
          return;
        }
        // успешный вход
        setSession(rememberedUser.id);
        window.location.href = 'index.html';
      } else {
        shakeDots();
        pinAttempts++;
        resetPinBuffer();
        updatePinLockState();
        if (pinAttempts >= PIN_MAX_ATTEMPTS) {
          toast('Быстрый вход заблокирован. Выполните полный вход.', 'err');
        }
      }
    }
  });

  /* --- Переключение вкладок --- */
  document.getElementById('authTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    switchTab(b.dataset.tab);
  });

  document.getElementById('toFullFromPin').addEventListener('click', () => showFullScreen('login'));
  document.getElementById('toPinFromFull').addEventListener('click', () => showPinScreen());

  /* --- Полный вход --- */
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    // сброс ошибок
    document.querySelectorAll('.field.error').forEach(f => f.classList.remove('error'));
    showMsg('loginMsg', '');

    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass = document.getElementById('loginPass').value;

    let hasErr = false;
    if (!email) { setFieldError('f-login-email', 'e-login-email', 'Введите email.'); hasErr = true; }
    else if (!isEmailGmail(email)) { setFieldError('f-login-email', 'e-login-email', 'Email должен быть в домене @gmail.com.'); hasErr = true; }
    if (!pass) { setFieldError('f-login-pass', 'e-login-pass', 'Введите пароль.'); hasErr = true; }
    if (hasErr) return;

    const user = getUserByEmail(email);
    if (!user) {
      showMsg('loginMsg', 'Пользователь с таким email не найден.', 'err');
      return;
    }
    if (!user.pass) {
      showMsg('loginMsg', 'У пользователя не задан пароль.', 'err');
      return;
    }
    const ok = await verifyHash(pass, user.pass.salt, user.pass.hash);
    if (!ok) {
      showMsg('loginMsg', 'Неверный пароль.', 'err');
      return;
    }
    const check = canLogin(user);
    if (!check.ok) {
      showMsg('loginMsg', check.msg, 'err');
      return;
    }
    setSession(user.id);
    window.location.href = 'index.html';
  });

  /* --- Регистрация --- */
  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.querySelectorAll('.field.error').forEach(f => f.classList.remove('error'));
    showMsg('regMsg', '');

    const lastname = document.getElementById('regLastname').value.trim();
    const name = document.getElementById('regName').value.trim();
    const patronymic = document.getElementById('regPatronymic').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pass = document.getElementById('regPass').value;
    const pass2 = document.getElementById('regPass2').value;
    const pin = document.getElementById('regPin').value;

    let hasErr = false;
    if (!lastname) { setFieldError('f-reg-lastname', 'e-reg-lastname', 'Введите фамилию.'); hasErr = true; }
    if (!name) { setFieldError('f-reg-name', 'e-reg-name', 'Введите имя.'); hasErr = true; }
    if (!patronymic) { setFieldError('f-reg-patronymic', 'e-reg-patronymic', 'Введите отчество.'); hasErr = true; }
    if (!email) { setFieldError('f-reg-email', 'e-reg-email', 'Введите email.'); hasErr = true; }
    else if (!isEmailGmail(email)) { setFieldError('f-reg-email', 'e-reg-email', 'Email должен быть @gmail.com.'); hasErr = true; }
    else if (getUserByEmail(email)) { setFieldError('f-reg-email', 'e-reg-email', 'Пользователь с таким email уже существует.'); hasErr = true; }
    if (!pass) { setFieldError('f-reg-pass', 'e-reg-pass', 'Введите пароль.'); hasErr = true; }
    else if (pass.length < 6) { setFieldError('f-reg-pass', 'e-reg-pass', 'Пароль должен содержать минимум 6 символов.'); hasErr = true; }
    if (!pass2) { setFieldError('f-reg-pass2', 'e-reg-pass2', 'Повторите пароль.'); hasErr = true; }
    else if (pass !== pass2) { setFieldError('f-reg-pass2', 'e-reg-pass2', 'Пароли не совпадают.'); hasErr = true; }
    if (!isPin5(pin)) { setFieldError('f-reg-pin', 'e-reg-pin', 'PIN-код должен состоять ровно из 5 цифр.'); hasErr = true; }
    if (hasErr) return;

    // Первый пользователь — администратор, остальные — заявка
    const users = getUsers();
    const isFirst = users.length === 0;

    const passH = await makeHash(pass);
    const pinH = await makeHash(pin);

    const user = {
      id: uid(),
      fio: `${lastname} ${name} ${patronymic}`,
      lastname, name, patronymic,
      email,
      pass: passH,
      pin: pinH,
      avatar: '',
      role: isFirst ? 'admin' : 'member',
      status: isFirst ? 'active' : 'pending',
      createdAt: nowISO()
    };
    users.push(user);
    saveUsers(users);

    if (isFirst) {
      showMsg('regMsg', 'Регистрация администратора успешна! Выполните вход.', 'ok');
      setTimeout(() => {
        switchTab('login');
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPass').focus();
      }, 900);
    } else {
      showMsg('regMsg', 'Заявка отправлена на рассмотрение администратору.', 'ok');
      document.getElementById('regForm').reset();
    }
  });

  function setFieldError(fieldId, msgId, msg) {
    const f = document.getElementById(fieldId);
    if (f) f.classList.add('error');
    const m = document.getElementById(msgId);
    if (m) m.textContent = msg;
  }

  /* --- Стартовый экран --- */
  if (rememberedUser) {
    // показываем PIN-экран, если сессии нет
    showPinScreen();
  } else {
    showFullScreen('login');
  }
  // если пользователь уже вошёл — перенаправим
  if (getSession()) {
    window.location.href = 'index.html';
  }
  </script>
</body>
</html>
